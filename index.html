<script>
'use strict';
/* ============================================================
   HOLLOWMERE: BLOODLINE — a text-adventure RPG of loops & legacy
   ============================================================ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function makeEnemy(zi,boss,forceEl){

 if(early){lvl=1;tpl=h.kills===0?z.mon[1]:pick([z.mon[0],z.mon[1]]);}
 let notor=null;
 if(!boss&&!early){const nb=(h.bounties||[]).find(b=>b.type==='notorious'&&b.zi===zi&&Math.random()<.3);if(nb){const t2=z.mon.find(m=>m.n===nb.name);if(t2){tpl=t2;notor=nb;}}}
 const el=!boss&&(!!notor||forceEl||(h.lvl>=5&&Math.random()<.12)),tier=boss?'b':el?'e':'n';
 if(el)lvl=Math.min(lvl+1,zmax+1);
 const packN=(!boss&&!early&&!el&&PACKS.includes(tpl.n)&&h.lvl>=4&&Math.random()<.18)?ri(3,lvl>=15?5:4):0;
 const hm={n:1,e:1.9,b:3.6}[tier]*(notor?1.3:1)*(early?EARLY_HP:1)*lowHp(lvl),am={n:1,e:1.3,b:1.5}[tier]*(early?EARLY_ATK:1)*(early?1:lowAtk(lvl));
 const base=14+13*lvl+.6*lvl*lvl;
 const hp=Math.round(base*tpl.hp*hm*dm()*(packN?packN*.8:1));
 return{name:notor?`Notorious ${notor.nick} the ${tpl.n}`:(el?pick(['Alpha','Ravenous','Ancient','Frenzied'])+' ':'')+tpl.n+(packN?' Pack':''),base:tpl.n,pack:packN,notor:notor?notor.id:null,lvl,tier,zi,
  hp,max:hp,atk:Math.round((2.5+2.4*lvl+.08*lvl*lvl)*1.35*tpl.atk*am*dm()),def:Math.round((2+1.3*lvl)*tpl.def),

function danger(e){

  S.world.gold+=g;note(`Sold ${n} item(s) for ${g}g.`);
 },
 usePot(id){const p=P(),w=S.world,po=POTS[id];if(!w.pots[id]||S.hero.hp>=p.maxhp)return;w.pots[id]--;const n=healHero(Math.max(po.min,Math.round(p.maxhp*po.pct)));note(`${po.n}: +${n} HP.`,'g');},
 alloc(k){const h=S.hero;if(h.pts<1)return;h.pts--;h.st[k]+=1;},
 // shop
 buyPot(id){const w=S.world,po=POTS[id];if(w.gold<potPrice(id)){note('Not enough gold.','e');return;}w.gold-=potPrice(id);w.pots[id]++;},
 buyGear(i){
  const w=S.world,it=w.shop[+i];if(!it)return;if(w.gold<it.price){note('Not enough gold.','e');return;}
  if(w.inv.length>=invMax()){note('Your pack is full.','e');return;}
  w.gold-=it.price;delete it.price;w.inv.push(it);w.shop.splice(+i,1);note(`Bought ${it.name}.`);S.modal=null;
 },
 shopView(i){S.modal={t:'shop',i:+i};},
 buyTome(id){
  const w=S.world,h=S.hero,l=h.skills[id]||0;if(l>=SKMAX)return;if(skCapped(l)){note('That skill needs a breakthrough first (Hero tab).','e');return;}const pr=tomePrice(id,l);
  if(w.gold<pr){note('Not enough gold.','e');return;}w.gold-=pr;h.skills[id]=l+1;note(`${SK[id].n} ${l?'upgraded to Lv '+(l+1):'learned'}.`,'g');
 },
 // guild
 accept(i){
  const h=S.hero,w=S.world;if(h.active.length>=3){note('You can hold at most 3 contracts.','e');return;}
  const c=w.board[+i];if(!c)return;if(rankIdx(h.contracts)<c.rankReq){note('Your rank is too low.','e');return;}
  w.board.splice(+i,1);h.active.push(c);
 },
 abandon(i){S.hero.active.splice(+i,1);},
 complete(i){
  const h=S.hero,w=S.world,c=h.active[+i];if(!c||!contractDone(c))return;
  if(c.type==='gather')w.mats[c.target]-=c.n;
  const before=rankIdx(h.contracts),rb=1+rankIdx(h.contracts)*.05;
  const gold=Math.round(c.gold*rb*(wf('guildfav')?1.1:1)*(rel('guildseal')?1.25:1)),xp=Math.round(c.xp*catchMult());
  w.gold+=gold;h.contracts++;h.pts+=2;h.active.splice(+i,1);
  const z=ZONES[c.zi],it=genItem(z.max-ri(0,2),rollRarity(c.q===2?[0,10,60,30]:[10,55,28,7]));
  const r=addItem(it);
  S.cres=[`✅ Contract complete! +${gold}g, +${xp} XP, +2 stat points`,`🎁 ${rarName(it)}${r==='full'?' (pack full, sold)':''}`,...addXP(xp)];
  if(rankIdx(h.contracts)>before){S.cres.push(`🏅 <b>Promoted to ${RANKS[rankIdx(h.contracts)].n} rank!</b> (+2 stamina, +5% contract gold, new hunting grounds)`);}
  S.cres.push(`📈 Renown bonus: +${(Math.min(60,h.contracts*1.2)).toFixed(1)}% HP/attack/defense`);
  note(`Contract done (${h.contracts} total).`,'g');
 },
 // tinker wagon
 tinker(p,b){
  const [mode,t]=p.split(':'),tier=+t,w=S.world;
  const cost=tinkerCost(mode);
  const have=Object.keys(w.mats).filter(m=>MT[m]===tier).reduce((a,m)=>a+w.mats[m],0);
  if(have<cost){note('Not enough materials.','e');return;}
  if(mode==='slot'){S.modal={t:'slot',tier};return;}
  ACT._tinker(mode,tier,null);
 },
 tslot(slot){const t=S.modal.tier;S.modal=null;ACT._tinker('slot',t,slot);},
 _tinker(mode,tier,slot){
  const w=S.world;if(w.inv.length>=invMax()){note('Your pack is full.','e');return;}
  let need=tinkerCost(mode);
  Object.keys(w.mats).filter(m=>MT[m]===tier).forEach(m=>{const t=Math.min(need,w.mats[m]);w.mats[m]-=t;need-=t;if(!w.mats[m])delete w.mats[m];});
  const z=ZONES[tier],il=ri(z.min,z.max);
  const ws=mode==='grand'?[0,20,55,25]:[20,45,28,7];
  const it=genItem(il,rollRarity(ws),slot);w.inv.push(it);
  S.modal={t:'item',id:it.id,fresh:1};note(`The Tinker hands you ${it.name}.`,'y');
 },
 // menu
 auto(){S.set.autosell=!S.set.autosell;},
 retire(){S.modal={t:'confirm',a:'retireYes',q:'Retire this hero and pass the torch? You keep gold, gear and materials but the heir starts at level 1 without skills.'};},
 retireYes(){S.modal=null;die('retirement');},
 reset(){S.modal={t:'confirm',a:'resetYes',q:'Erase ALL progress, including the bloodline? This cannot be undone.'};},
 resetYes(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=null;},
 heir(){makeHeir();},
 export(){S.modal={t:'export'};},
 import(){const v=$('#io').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.world||!o.hero)throw 0;S=o;ensureState();S.modal=null;note('Save imported.','g');}catch(e){const m=$('#ioerr');if(m)m.textContent='That does not look like a valid save.';throw 'skip';}},
 doimport(){S.modal={t:'import'};}
};

const chkChance=(stat,d,L)=>{const v=P().st[stat]||0;return clamp(Math.round(55+(v-(4+L*.9)-(d||0)*2)*4),12,95);};

const bestBonus=n=>{const b=S.world.best[n];return b?Math.min(.25,Math.floor(b.k/10)*.01):0;};
function learnTome(zi){
 const h=S.hero,pool=Object.keys(SK).filter(k=>SK[k].t<=Math.max(zi,0)+1&&(h.skills[k]||0)<SKMAX&&!skCapped(h.skills[k]||0));

}
/* generic outcome applier used by events, dungeons and quests */
function applyOut(o,zi,qid){
 const h=S.hero,w=S.world,p=P(),L=lvlRef(zi),out=[],u=10+L*3;
 if(o.t)out.push(o.t);
 if(o.gold){let g=o.gold>0?Math.round(o.gold*u*(1+p.goldf/100)):Math.round(o.gold*u);if(g<0&&w.gold+g<0)g=-w.gold;w.gold+=g;if(g)out.push(g>=0?`💰 +${g} gold`:`💸 ${g} gold`);}
 if(o.xp){const x=Math.round(o.xp*(10+L*3.2)*catchMult()*(1+p.xpf/100));out.push(`✨ +${x} XP`);out.push(...addXP(x));}
 if(o.hp){
  if(o.hp>0){const n=healHero(Math.round(p.maxhp*o.hp));out.push(`💚 +${n} HP`);}
  else{const d=Math.max(1,Math.round(p.maxhp*-o.hp*(hasSpecial('delver')?.5:1)));h.hp=Math.max(1,h.hp-d);out.push(`💔 −${d} HP`);}
 }
 if(o.item!=null){const it=genItem(L+ri(0,2),rollRarity(RW[o.item],1+p.dropf/200));const r=addItem(it);out.push(`🎁 ${rarName(it)} <span class="mut">(${RAR[it.rar].n})</span>${r==='full'?' — pack full, sold':r==='sold'?' — auto-sold':''}`);}
 if(o.mat){const z=ZONES[clamp(zi==null?tierOf(h.lvl):zi,0,5)],m=pick(ZGATHER[ZONES.indexOf(z)]);w.mats[m]=(w.mats[m]||0)+o.mat;out.push(`🧶 +${o.mat} ${m}`);}
 if(o.pot){w.pots[o.pot]=(w.pots[o.pot]||0)+1;out.push(`🧪 ${POTS[o.pot].n}`);}
 if(o.tome){const t=learnTome(zi==null?tierOf(h.lvl):zi);if(t)out.push(t);}
 if(o.fx)out.push(addFx(o.fx));

let PZID=1;
const PZ={};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
PZ.riddle={n:'Riddle',soft:false,tries:2,
 gen(D){const r=pick(RIDDLES);const wrong=shuffle(RIDDLES.filter(x=>x[1]!==r[1]).map(x=>x[1])).slice(0,3);const ch=shuffle([r[1],...wrong]);return{q:r[0],ch,ans:ch.indexOf(r[1]),elim:[]};},
 act(pz,p){const i=+p;if(pz.d.elim.includes(i))return;if(i===pz.d.ans)return 'win';pz.d.elim.push(i);return 'bad';},
 hint(pz){const w=pz.d.ch.map((c,i)=>i).filter(i=>i!==pz.d.ans&&!pz.d.elim.includes(i));if(w.length){pz.d.elim.push(pick(w));return 'One false answer fades away.';}return 'Nothing left to eliminate.';},
 view(pz){return `<p><i>"${esc(pz.d.q)}"</i></p>`+pz.d.ch.map((c,i)=>btn(esc(c),'pz',i,'',pz.d.elim.includes(i))).join('');}
};
const LV=[['🔴','Red'],['🔵','Blue'],['🟢','Green'],['🟡','Yellow']];
function perms(n){if(n===1)return[[0]];const out=[];perms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);out.push(q);}});return out;}
PZ.levers={n:'Lever Sequence',soft:false,tries:3,
 gen(D){
  const n=D.lvl<20?3:4,all=perms(n),sol=pick(all),pos=a=>sol.indexOf(a);
  const mk=()=>{const a=ri(0,n-1);let b=ri(0,n-1);while(b===a)b=ri(0,n-1);const ty=pick(['before','before','notfirst','notlast','adj']);
   if(ty==='before'&&pos(a)>pos(b))return mk();if(ty==='notfirst'&&pos(a)===0)return mk();if(ty==='notlast'&&pos(a)===n-1)return mk();if(ty==='adj'&&pos(b)!==pos(a)+1)return mk();return{ty,a,b};};
  const test=(c,p)=>{const x=p.indexOf(c.a),y=p.indexOf(c.b);return c.ty==='at'?x===c.b:c.ty==='before'?x<y:c.ty==='notfirst'?x!==0:c.ty==='notlast'?x!==n-1:y===x+1;};
  const clues=[];let cand=all.slice();
  for(let i=0;i<40&&cand.length>1;i++){const c=mk();const nc=cand.filter(p=>test(c,p));if(nc.length<cand.length){clues.push(c);cand=nc;}}
  for(let a=0;cand.length>1&&a<n;a++){const c={ty:'at',a,b:pos(a)};const nc=cand.filter(p=>test(c,p));if(nc.length<cand.length){clues.push(c);cand=nc;}}
  const nm=i=>`${LV[i][0]} ${LV[i][1]}`;
  clues.forEach(c=>{c.txt=c.ty==='at'?`The ${nm(c.a)} lever is pulled ${['first','second','third','fourth'][c.b]}.`:c.ty==='before'?`The ${nm(c.a)} lever is pulled before the ${nm(c.b)} lever.`:c.ty==='notfirst'?`The ${nm(c.a)} lever is never pulled first.`:c.ty==='notlast'?`The ${nm(c.a)} lever is never pulled last.`:`The ${nm(c.b)} lever is pulled immediately after the ${nm(c.a)} lever.`;});
  return{n,sol,clues,sel:[]};},
 act(pz,p){const d=pz.d;if(p==='r'){d.sel=[];return;}const i=+p;if(d.sel.includes(i))return;d.sel.push(i);
  if(d.sel.length===d.n){if(d.sel.every((v,k)=>v===d.sol[k]))return 'win';d.sel=[];return 'bad';}},
 hint(pz){const d=pz.d;let k=0;while(k<d.sel.length&&d.sel[k]===d.sol[k])k++;d.sel=d.sol.slice(0,Math.min(d.n-1,k+1));return 'A lever clicks into place on its own.';},
 view(pz){const d=pz.d,nm=i=>`${LV[i][0]} ${LV[i][1]}`;
  return `<p class="mut sm">The inscriptions say:</p><div class="card sm">${d.clues.map(c=>`• ${c.txt}`).join('<br>')}</div><p>Order pulled: ${d.sel.length?d.sel.map(nm).join(' → '):'<span class="mut">none</span>'}</p><div class="grid">${[...Array(d.n).keys()].map(i=>btn(nm(i),'pz',i,'',d.sel.includes(i))).join('')}</div><div style="height:6px"></div>${btn('Reset','pz','r','c')}`;}
};
PZ.lock={n:'Combination Lock',soft:true,tries:7,
 gen(D){return{code:shuffle([1,2,3,4,5,6]).slice(0,3),cur:[],hist:[],rev:null};},
 act(pz,p){const d=pz.d;
  if(p==='del'){d.cur.pop();return;}
  if(p==='go'){if(d.cur.length<3)return;let ex=0,mis=0;d.cur.forEach((v,i)=>{if(v===d.code[i])ex++;else if(d.code.includes(v))mis++;});d.hist.push({g:d.cur.slice(),ex,mis});const w=ex===3;d.cur=[];return w?'win':'bad';}
  const v=+p;if(d.cur.length<3&&!d.cur.includes(v))d.cur.push(v);},
 hint(pz){const d=pz.d;const i=ri(0,2);d.rev=i;return `The ${['first','second','third'][i]} digit is ${d.code[i]}.`;},
 view(pz){const d=pz.d;
  return `<p class="mut sm">A 3-digit code, digits 1–6, no repeats. 🟢 = right digit in the right place, 🟡 = right digit, wrong place.</p>`+(d.rev!=null?`<p class="sm up">Hint: digit ${d.rev+1} is ${d.code[d.rev]}.</p>`:'')+
  `<div class="card sm">${d.hist.length?d.hist.map(h=>`${h.g.join(' ')} → 🟢${h.ex} 🟡${h.mis}`).join('<br>'):'<span class="mut">No guesses yet.</span>'}</div><p class="c" style="font-size:28px;letter-spacing:8px">${[0,1,2].map(i=>d.cur[i]||'·').join(' ')}</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6].map(v=>btn(v,'pz',v,'c',d.cur.includes(v))).join('')}</div><div class="grid" style="margin-top:8px">${btn('⌫ Delete','pz','del','c')}${btn('Try code','pz','go','pri c',d.cur.length<3)}</div>`;}
};
const RUNES=['🔥','💧','🌿','⚡','🌙'];
PZ.memory={n:'Rune Memory',soft:false,tries:3,
 gen(D){const len=4+Math.floor(D.lvl/25);return{seq:[...Array(len)].map(()=>ri(0,4)),pos:0,show:true,len};},
 act(pz,p){const d=pz.d;if(d.show)return;const v=+p;if(v===d.seq[d.pos]){d.pos++;if(d.pos>=d.seq.length)return 'win';return;}d.pos=0;d.show=true;schedHide(pz);return 'bad';},
 hint(pz){pz.d.show=true;pz.d.pos=0;schedHide(pz);return 'The runes flare again.';},
 view(pz){const d=pz.d;
  return d.show?`<p class="mut sm">Memorize the sequence...</p><p class="c" style="font-size:34px;letter-spacing:10px">${d.seq.map(i=>RUNES[i]).join(' ')}</p>`:
  `<p class="mut sm">Repeat the sequence (${d.pos}/${d.seq.length}).</p><p class="c" style="font-size:28px;letter-spacing:8px">${d.seq.map((s,i)=>i<d.pos?RUNES[s]:'❔').join(' ')}</p><div class="grid" style="grid-template-columns:repeat(5,1fr)">${RUNES.map((r,i)=>btn(r,'pz',i,'c')).join('')}</div>`;}
};
function schedHide(pz){
 const id=pz.id,ms=1000+pz.d.seq.length*700;
 if(typeof setTimeout==='undefined')return;
 setTimeout(()=>{if(S&&S.pz&&S.pz.id===id){S.pz.d.show=false;save();render();}},ms);

PZ.doors={n:'Three Doors',soft:false,tries:2,
 gen(D){
  const nmD=['A','B','C'];
  for(let t=0;t<500;t++){
   const st=[0,1,2].map(()=>{const ty=pick(['has','not','either']),x=ri(0,2);let y=ri(0,2);while(y===x)y=ri(0,2);return{ty,x,y};});
   const tru=(s,p)=>s.ty==='has'?p===s.x:s.ty==='not'?p!==s.x:(p===s.x||p===s.y);
   const ok=[0,1,2].filter(p=>st.filter(s=>tru(s,p)).length===1);
   if(ok.length===1){
    st.forEach(s=>{s.txt=s.ty==='has'?`"The treasure is behind door ${nmD[s.x]}."`:s.ty==='not'?`"The treasure is NOT behind door ${nmD[s.x]}."`:`"The treasure is behind door ${nmD[s.x]} or door ${nmD[s.y]}."`;});
    return{st,ans:ok[0],elim:[]};
   }
  }
  const st=[{txt:'"The treasure is behind door B."'},{txt:'"The treasure is NOT behind door B."'},{txt:'"The treasure is NOT behind door A."'}];return{st,ans:0,elim:[]};
 },
 act(pz,p){const i=+p;if(pz.d.elim.includes(i))return;if(i===pz.d.ans)return 'win';pz.d.elim.push(i);return 'bad';},
 hint(pz){const w=[0,1,2].filter(i=>i!==pz.d.ans&&!pz.d.elim.includes(i));if(w.length){pz.d.elim.push(w[0]);return 'One of the doors crumbles to dust.';}return 'Nothing more to cross out.';},
 view(pz){return `<p class="mut sm">Three doors, each with a plaque. <b>Exactly one plaque tells the truth.</b> One door hides treasure; the others hide worse.</p>`+pz.d.st.map((s,i)=>`<div class="card sm"><b>Door ${'ABC'[i]}</b><br><i>${s.txt}</i></div>${btn('Open door '+'ABC'[i],'pz',i,'',pz.d.elim.includes(i))}`).join('');}
};
const SCITEMS=[['🗡️ Dagger',2],['👑 Crown',5],['🏺 Urn',3],['📖 Tome',4],['💀 Skull',1],['🪙 Idol',6],['🔔 Bell',7],['🕯️ Candlestick',3],['⚖️ Anvil',9],['🪓 Hatchet',4]];
PZ.scales={n:'Offering Scales',soft:true,tries:4,

Object.assign(ACT,{
 explore(zi){const h=S.hero;zi=+zi;if(h.sta<1){note('Too tired to explore. Sleep first.','e');return;}if(S.world.map.explore[zi]<20){note('You need to know this region better (20%) before you can scout it. Keep hunting here.','e');return;}doExplore(zi);},
 evch(i){
  const ev=S.ev,E=ev.def,c=E.ch[+i];if(!c||ev.res)return;
  const zi=ev.zi,L=lvlRef(zi),u=10+L*3,h=S.hero,w=S.world;

   if(c.cost.gold){const g=Math.round(c.cost.gold*u);if(w.gold<g){note('Not enough gold.','e');return;}w.gold-=g;}
   if(c.cost.pot){if(!w.pots[c.cost.pot]){note('You have none.','e');return;}w.pots[c.cost.pot]--;}
  }
  let o;
  if(c.chk){o=Math.random()*100<chkChance(c.chk.s,c.chk.d,L)?c.ok:c.no;}
  else if(Array.isArray(c.o)){o=c.o[wroll(c.o.map(x=>x[0]))][1];}
  else o=c.o;

 },

 },

 dgGo(d){
  const dg=S.dg,r=dgRoom(),code=r.ex[d];if(!code||code===3)return;
  const n=dgNb(r,d);

  if(blocking&&n.i!==dg.hist[dg.hist.length-1]){dgSay('🚫 Something blocks the way. Deal with this room, or retreat the way you came.');return;}

 },
 dgFight(){

 },

 dgChest(mode){
  const dg=S.dg,r=dgRoom(),D=getD(dg.id);if(r.d||r.opened)return;

  if(mode==='smash'){if(Math.random()*100<chkChance('str',0,L)){trap=false;smash=true;lines.push('💥 You smash the chest open. Something inside breaks.');}else{trap=r.tr;lines.push('💥 The chest holds. You hurt your hands.');const d=trapHit(.25);lines.push(`💔 −${d} HP`);}}

 },
 dgTrap(mode){

  let ok,lines=[];

  else{ok=true;const d=trapHit(.5);lines.push(`🛡️ You power through. −${d} HP`);}
  if(mode!=='brace'){if(ok)lines.push('✅ You get past safely.');else{const d=trapHit(1);lines.push(`💥 You trigger it! −${d} HP`);}}

 },
 dgShrine(mode){

function playerAct(type,arg){
 const c=S.cb;if(!c||c.over)return;
 const h=S.hero,p=P(),e=c.e;
 c.guard=false;
 if(c.hb.stun>0){c.hb.stun=0;say('💫 You are stunned and cannot act.','e');return afterPlayer();}
 if(type==='atk'){strike(c.rh?1.25:1);c.rh=false;c.st.atk++;c.focus=Math.min(p.maxfocus,c.focus+1);}
 else if(type==='guard'){c.guard=true;c.st.guard++;c.focus=Math.min(p.maxfocus,c.focus+3);say('🛡️ You brace yourself.');}
 else if(type==='skill'){
  if(!castSkill(arg))return;c.st.skill++;if(S.hero.path==='blade'&&pathTier(2))c.rh=true;if(SKT[arg]&&SKT[arg].includes('fire'))c.st.fire++;if(arg==='mend')c.st.heal++;
  if(rel('echo')&&e.hp>0&&['power','flurry','bash','venom','fire','bite','exec','meteor'].includes(arg)&&Math.random()<.35){say('🔁 <b>Echo Stone!</b> The skill fires again.','y');castSkill(arg,true);}
 }
 else if(type==='pot'){
  const w=S.world,po=POTS[arg];if(!w.pots[arg])return;
  if(h.hp>=p.maxhp){say('You are already at full health.');return;}
  const free=rel('philo')&&Math.random()<.25;if(!free)w.pots[arg]--;c.st.heal++;
  const n=healHero(Math.round(Math.max(po.min,p.maxhp*po.pct)*(1+partyPass('potion')+(rel('philo')?.6:0))));
  say(`🧪 ${po.n}: +${n} HP${free?' (not consumed!)':''}.`,'g');
 }
 else if(type==='flee'){
  if(c.boss){say('You cannot flee from a boss.','e');return;}
  const ch=hasSpecial('runner')?100:clamp(45+p.st.agi*.6-e.lvl*.4,15,90);
  if(Math.random()*100<ch){c.over=true;fleeOK();return;}
  say('You fail to get away.','e');
 }
 afterPlayer();
}

 let tpl;

 else{const a=pick(ZONES[ri(2,5)].mon);tpl={n:'Abyssal '+a.n,hp:a.hp,atk:a.atk,def:a.def,pat:a.pat};}
 const tier=boss?'b':el?'e':'n',hm={n:1,e:1.5,b:2.2}[tier]*(1+.035*f)*dm(),am={n:1.05,e:1.2,b:1.3}[tier]*(1+.02*f)*dm();
 const base=14+13*L+.6*L*L,hp=Math.round(base*tpl.hp*hm);
 return{name:(el?'Elder ':'')+tpl.n,base:tpl.n,lvl:L,tier,zi:5,hp,max:hp,atk:Math.round((2.5+2.4*L+.08*L*L)*1.35*tpl.atk*am),def:Math.round((2+1.3*L)*tpl.def),pat:tpl.pat,pat2:tpl.pat2||null,pi:0,stun:0,poison:0,pd:0,buff:0,dg:'abyss',intro:boss?'The Abyss gives up one of its own.':null};

function delveMilestone(f){
 const w=S.world,h=S.hero,lines=[];
 const first=f>(w.delve.best||0);
 if(!first)return lines;
 w.delve.best=f;w.delve.who=`${h.name} ${h.fam} (Gen ${w.gen})`;
 if(f===5||f===15){h.pts+=2;lines.push('📈 Milestone! +2 stat points.');}
 if(f===10)lines.push(...addRelic('packleader'));
 if(f===20)lines.push(...addRelic('prism'));
 if(f===25){h.pts+=3;lines.push('📈 Milestone! +3 stat points.');}
 if(f===30){const un=Object.keys(RELICS).filter(r=>!w.relics[r]);lines.push(...addRelic(un.length?pick(un):'prism'));}

 return lines;
}

/* ---- temporary work: a guest for a few fights ---- */
function guestFight(c){
 const h=S.hero,g=h.guest;if(!g||g.trial)return[];
 const D=COMP[g.id],X=COMPX[g.id],u=c.party.find(x=>x.id===g.id),lines=[];
 let sc=2;
 if(u){if(u.down)sc-=3;else sc+=1;sc+=Math.min(2,c.st.spec[g.id]||0);}
 if(c.st[X.quirk[0]]>=X.quirk[1]){sc+=2;lines.push(`💬 ${firstName(D)}: "${X.quirk[2]}"`);}
 g.score+=sc;g.fights++;
 if(g.fights>=g.need){
  const m=S.world.meet[g.id];
  const gain=clamp(Math.round(10*g.score/(g.need*7)),-3,10);
  m.job=clamp(m.job+gain,0,30);m.jobs++;
  lines.push(gain>=6?`🤝 <b>You and ${D.n} work well together.</b> (+${gain} trust)`:gain>=3?`🤝 ${D.n} says it went fine. (+${gain} trust)`:`😐 ${D.n} says it just did not click. (${gain>=0?'+':''}${gain} trust)`);
  h.guest=null;
 }
 return lines;
}
Object.assign(ACT,{
 trialStart(id){if(!trialReady(id))return;ACT.talk('t_'+id);S.talkBack='tavern';},
 approach(id){if(!canApproach(id))return;S.hireLines=meetComp(id,0);},
 convo(id){
  const h=S.hero,m=S.world.meet[id];if(!m||h.talked[id]===h.day)return;
  const X=COMPX[id],idx=m.sc<3?X.sc[m.sc]:ri(1,12);
  S.cv={id,idx,first:m.spoke===0,res:null};S.screen='convo';
 },
 cvch(i){
  const cv=S.cv,X=COMPX[cv.id],m=S.world.meet[cv.id],ch=SCEN[cv.idx].ch[+i];if(!ch||cv.res)return;
  let d=X.like.includes(ch[1])?9:X.dis.includes(ch[1])?-5:3;
  if(d>0)d=Math.round(d*(1+bgv('trust')));if(m.sc>=3)d=Math.round(d*.6);
  const b=m.chat;m.chat=clamp(m.chat+d,0,45);m.sc++;m.spoke=1;S.hero.talked[cv.id]=S.hero.day;
  const kind=d>=5?0:d>0?1:2,real=m.chat-b;
  cv.res=[`<i>${X.re[kind]}</i>`,d>0?(real>0?`💞 Trust +${real}`:'💞 They already know you well.'):`💔 Trust ${real}`];
 },
 cvdone(){S.cv=null;S.screen='tavern';},
 jobStart(id){const h=S.hero;if(h.guest){note('Finish your current partnership first.','e');return;}if(!S.world.meet[id])return;h.guest={id,need:5,fights:0,score:0};note(`${COMP[id].n} will fight beside you for 5 fights.`,'y');},
 guestEnd(){const h=S.hero,g=h.guest;if(!g)return;if(g.trial){delete h.q['t_'+g.id];const m=S.world.meet[g.id];if(m)m.chat=Math.max(0,m.chat-2);}h.guest=null;},
 invite(id){
  if(!canInvite(id))return;
  S.hireLines=[`<i>${COMP[id].n}: "You earned it. If the offer stands, I would be honored to fight at your side."</i>`,...recruit(id)];
 }
});

}

function codexEntries(){
 const out=[];
 ZONES.forEach((z,i)=>{
  z.mon.forEach(m=>out.push({name:m.n,zi:i,sec:'z'+i,lvl:[z.min,z.max],tpl:m,tier:'n',pack:PACKS.includes(m.n),src:z.n}));
  out.push({name:z.boss.n,zi:i,sec:'z'+i,lvl:[z.max,z.max],tpl:z.boss,tier:'b',src:z.n+' (boss)'});
 });
 DUNGEONS.filter(d=>!d.dyn).forEach(D=>{
  D.mon.forEach(a=>out.push({name:a[0],zi:D.zi,sec:'dg',lvl:[D.lvl,D.lvl+2],tpl:{n:a[0],hp:a[1],atk:a[2],def:a[3],pat:a[4]},tier:'n',dg:D,src:D.n}));
  out.push({name:D.kw,zi:D.zi,sec:'dg',lvl:[D.lvl+2,D.lvl+2],tpl:{n:D.kw,hp:D.mon[0][1],atk:D.mon[0][2],def:D.mon[0][3],pat:D.mon[0][4]},tier:'e',dg:D,src:D.n+' (key guardian)'});
  out.push({name:D.boss.n,zi:D.zi,sec:'dg',lvl:[D.lvl+3,D.lvl+3],tpl:D.boss,tier:'b',dg:D,src:D.n+' (boss)'});
 });
 return out;
}
function entryEnemy(en,L){
 const t=en.tpl,tier=en.tier;
 const hm=en.dg?({n:1,e:1.5,b:2.1}[tier]*en.dg.diff*1.05):({n:1,e:1.9,b:3.6}[tier]),am=en.dg?({n:1,e:1.15,b:1.25}[tier]*en.dg.diff*1.05):({n:1,e:1.3,b:1.5}[tier]);
 const base=14+13*L+.6*L*L,hp=Math.round(base*t.hp*hm*dm());
 return{name:en.name,base:en.name,lvl:L,tier,zi:en.zi,hp,max:hp,atk:Math.round((2.5+2.4*L+.08*L*L)*1.35*t.atk*am*dm()),def:Math.round((2+1.3*L)*t.def),pat:t.pat,pack:0};
}

function codexView(){
 const w=S.world,h=S.hero,sec=S.cxs||'z0',all=codexEntries();
 const known=en=>!!(w.best[en.name]&&(w.best[en.name].seen||w.best[en.name].k>0));
 const cnt=all.filter(known).length;
 let t=`<p class="mut sm">Everything you've met in the wild. Encounter levels follow a <b>bell curve</b> around your level: usually close, but now and then something far stronger wanders in. Check the danger rating, and <b>run</b> when it's red. Entries fill in as you meet things. Every 10 kills of a species grants +1% damage against it (max +25%), shared across your bloodline.</p>`;

 const secsV=secs.filter(x=>x[0]===sec||all.some(en=>en.sec===x[0]&&known(en)));
 t+=`<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">${secsV.map(x=>btn(x[1],'cxsec',x[0],sec===x[0]?'pri c':'c')).join('')}</div>`;
 const list=all.filter(en=>en.sec===sec&&known(en));
 if(!list.length)t+='<p class="mut sm">Nothing recorded here yet.</p>';
 let lastSrc='';
 list.forEach(en=>{

  if(open&&k){

  }
 });
 return t;
}

 study(id){

const NICKS=['Gnash','Scar','Hollowback','Redmaw','Old Grudge','Gloom','Splinter','Rust','Fang','Dreadhide','Moonmad','Ironjaw','Bonecrusher','Whisper','Cinderheart'];
const BRANKS=[['Rookie',0],['Tracker',5],['Stalker',15],['Reaper',35],['Legend',70],['Apex',120]];
const brank=()=>{let r=0;BRANKS.forEach((x,i)=>{if(S.world.bounty.kills>=x[1])r=i;});return r;};
const bountyActive=name=>!!(S.hero&&(S.hero.bounties||[]).some(b=>b.name===name));
function refreshBounties(){
 const w=S.world,h=S.hero,r=rankIdx(h.contracts);
 if(!w.guild){w.bounty.board=[];return;}
 const ents=codexEntries().filter(en=>en.sec[0]==='z'&&en.tier==='n'&&Number(en.sec.slice(1))<=r&&en.lvl[0]<=h.lvl+10);
 const board=[];
 for(let i=0;i<4&&ents.length;i++){
  const en=pick(ents),not=i===3||Math.random()<.25,L=clamp(h.lvl,en.lvl[0],en.lvl[1]+2),n=not?1:ri(4,8),unit=15+L*6;
  board.push({id:w.nextId++,type:not?'notorious':'species',name:en.name,zi:en.zi,n,prog:0,lvl:L,nick:pick(NICKS),gold:Math.round(unit*(not?14:n*1.1)),xp:Math.round((10+L*3.2)*(not?10:n*1.3)),rep:not?3:n});
 }
 w.bounty.board=board;
}
function bountyKill(e){
 const h=S.hero,w=S.world,lines=[];h.bounties=h.bounties||[];
 for(const b of h.bounties.slice()){
  let hit=false;
  if(b.type==='species'&&e.base===b.name&&!e.notor){b.prog++;hit=b.prog>=b.n;}
  if(b.type==='notorious'&&e.notor===b.id){b.prog=1;hit=true;}
  if(!hit)continue;
  h.bounties=h.bounties.filter(x=>x!==b);
  const gold=Math.round(b.gold*(1+.02*brank())*(1+S.world.gold*0)),xp=Math.round(b.xp*catchMult());
  w.gold+=gold;w.bounty.kills+=b.rep;
  lines.push(`🎯 <b>Bounty complete: ${b.type==='notorious'?`Notorious ${esc(b.nick)} the ${esc(b.name)}`:`${b.n} × ${esc(b.name)}`}</b>`,`💰 +${gold} gold · ✨ +${xp} XP · 🏅 +${b.rep} marks`);
  lines.push(...addXP(xp));
  const it=genItem(b.lvl+ri(1,3),rollRarity(b.type==='notorious'?[0,0,50,50]:[30,45,20,5]));const r=addItem(it);
  lines.push(`🎁 ${rarName(it)} <span class="mut">(${RAR[it.rar].n})</span>${r==='full'?' — pack full, sold':''}`);
  if(b.type==='notorious'){const bb=w.best[b.name]=w.best[b.name]||{k:0,zi:b.zi};bb.k+=5;bb.not=(bb.not||0)+1;}
  const nb=brank();if(BRANKS[nb][1]>0&&w.bounty.kills-b.rep<BRANKS[nb][1])lines.push(`🏅 <b>Bounty rank: ${BRANKS[nb][0]}!</b> (+2% bounty rewards)`);
 }
 return lines;
}

 let t=`<p class="mut sm">Party: ${h.party.length}/${mp} companions. Slot 3 opens at Gold rank, slot 4 with the Pack Leader's Collar. Companions fight automatically; you can give <b>Orders</b> in battle to fire their specials on demand. They scale with you (up to 2 levels above).</p>`;
 const sl=synList();
 if(h.guest){const gd=COMP[h.guest.id];t+=`<div class="card sm" style="border-color:var(--acc)">${cpic(h.guest.id,26)} <b>${gd.n}</b> is working with you${h.guest.trial?' on a trial':` (${h.guest.fights}/${h.guest.need} fights)`}.</div>`;}
 t+=`<h2>Synergies</h2>`+(sl.length?sl.map(s=>`<div class="card sm" style="border-color:var(--good)"><b class="up">${s.n}</b><br>${s.d}</div>`).join(''):'<p class="mut sm">No active synergies. Try pairing a tank with a healer, or a pyromancer with a cryomancer.</p>');
 t+=`<h2>In your party</h2>`+(h.party.length?h.party.map(id=>compCard(id,true)).join(''):'<p class="mut sm">Empty. Meet people at the Tavern, in dungeons and through quests, then earn their trust.</p>');
 const bench=castIds().filter(id=>w.comp[id]&&!h.party.includes(id));
 if(bench.length)t+=`<h2>Roster</h2>`+bench.map(id=>compCard(id,false)).join('');
 const acq=castIds().filter(id=>!w.comp[id]&&w.meet[id]);
 if(acq.length)t+=`<h2>Acquaintances</h2>`+acq.map(id=>`<div class="item" style="cursor:default"><div><div class="n" style="display:flex;gap:8px;align-items:center">${cpic(id,32)} ${COMP[id].n}</div><div class="s">Trust ${trustOf(id)}/100 · find them at the Tavern</div></div></div>`).join('');
 const un=castIds().filter(id=>!w.comp[id]&&!w.meet[id]);
 if(un.length)t+=`<h2>Not yet met (${un.length})</h2>`+un.map(id=>`<div class="item" style="cursor:default"><div><div class="n">❔ Someone you have yet to meet</div><div class="s">${COMP[id].from.replace(/^Tavern \(appears/,"Tavern (someone appears").replace(/^Find them in/,"Held captive in")}</div></div></div>`).join('');
 return t;
};
VIEWS.relics=function(){

 t+=`<h2>Equipped (${h.rel.length}/2)</h2>`+(h.rel.length?h.rel.map(id=>`<div class="card"><b>${RELICS[id].ic} ${RELICS[id].n}</b><div class="sm">${RELICS[id].d}</div>${btn('Unequip','relicUn',id,'c')}</div>`).join(''):'<p class="mut sm">None.</p>');
 const own=Object.keys(RELICS).filter(id=>w.relics[id]&&!h.rel.includes(id));

};

const TAVERN_IDS=['brom','kael','orla','gorm'];
function metCard(id){
 const D=COMP[id],m=S.world.meet[id],h=S.hero,tr=trustOf(id);
 const talked=h.talked[id]===h.day,g=h.guest&&h.guest.id===id,qa=h.q['t_'+id];
 let status;
 if(m.test)status='✅ Test passed';
 else if(qa)status=`🎯 Trial in progress: ${qStep('t_'+id).j}`;
 else if(m.chat+m.job<20)status='Needs more trust before they will set you a test';
 else if(h.day<m.cool)status=`They want some space. Try again in ${m.cool-h.day} day${m.cool-h.day===1?'':'s'}.`;
 else status='🎯 Ready to set you a trial';
 let t=`<div class="card"><div class="row2"><b style="display:flex;align-items:center;gap:8px">${cpic(id,40)} ${D.n}</b><span class="tag">${D.role}</span></div>
 ${m.chat>=12&&COMPX[id]?`<div class="sm mut">You have noticed they value ${COMPX[id].like.map(t=>TRAITS[t]).join(' and ')}.</div>`:''}<div class="sm mut">Trust ${tr}/100 · chats ${m.chat}/45 · work ${m.job}/30${m.test?' · test +25':''}</div>${bar(tr,100,'xp')}<div class="sm">${status}</div>`;
 if(g&&!h.guest.trial)t+=`<div class="sm up">Working with you: ${h.guest.fights}/${h.guest.need} fights</div>`;
 t+=`<div class="grid" style="margin-top:8px">${btn('💬 Talk','convo',id,'c',talked,talked?'once a day':'')}${btn('🤝 Work together','jobStart',id,'c',!!h.guest,h.guest?'busy':'5 fights, see if you gel')}</div>`;
 if(qa){
  const done=stepDone('t_'+id);
  t+=`<div style="margin-top:6px">${done?btn('🎯 Report back','talk','t_'+id,'good c'):`<div class="sm mut">${stepProg('t_'+id)[0]}/${stepProg('t_'+id)[1]}</div>`+btn('Call off the trial','guestEnd',undefined,'c')}</div>`;
 }else if(trialReady(id)&&!m.test)t+=`<div style="margin-top:6px">${btn('🎯 Ask about their trial','trialStart',id,'pri c')}</div>`;
 if(g&&!h.guest.trial)t+=`<div style="margin-top:6px">${btn('End the partnership early','guestEnd',undefined,'c')}</div>`;
 if(canInvite(id))t+=`<div style="margin-top:6px">${btn(`✅ ${D.n.split(' ')[0]} is ready to join you`,'invite',id,'good c')}</div>`;
 return t+'</div>';
}
VIEWS.tavern=function(){
 const h=S.hero,w=S.world,cost=rumorCost();
 let t=`<h1>🍺 The Gilded Mug</h1><p class="mut">Smoke, rumor, and mediocre stew. People worth fighting beside don't sign up for gold. They have to <b>trust</b> you: talk to them (once a day each), work a few fights together, and pass their personal test.</p>${S.rumor?`<div class="card">${S.rumor}</div>`:''}`;
 if(S.hireLines){t+=`<div class="card">${S.hireLines.map(l=>`<p>${l}</p>`).join('')}</div>`;S.hireLines=null;}

 if(st.length)t+=`<h2>A stranger catches your eye</h2>`+st.map(id=>`<div class="card"><div class="sm mut">Someone at the bar has been watching you. A ${COMP[id].role.toLowerCase()}, by the look of them.</div>${btn('Go over and say hello','approach',id,'pri c')}</div>`).join('');

 t+=`<h2>Faces you know</h2>`+(met.length?met.map(metCard).join(''):'<p class="mut sm">No one yet. Keep hunting. People notice a capable adventurer, and some wait in dungeons or the wilds.</p>');
 t+=`<h2>Rumors</h2>${btn('👂 Listen in','listen',undefined,'c',h.lstDay===h.day,h.lstDay===h.day?'you have heard enough today':'free · once a day')}<div style="height:8px"></div>${btn('Buy a round for the house','rumor',undefined,'c',w.gold<cost,`${cost}g · loosens tongues`)}`;

VIEWS.convo=function(){
 const cv=S.cv,D=COMP[cv.id],X=COMPX[cv.id],sc=SCEN[cv.idx];
 let t=`<h1>${D.ic} ${D.n}</h1>`;
 if(cv.first)t+=`<div class="card"><i>${X.open}</i></div>`;

 if(!cv.res)t+=sc.ch.map((c,i)=>btn(esc(c[0]),'cvch',i,'')).join('');
 else t+=`<div class="card">${cv.res.map(l=>`<p>${l}</p>`).join('')}</div>${btn('Done','cvdone',undefined,'pri c')}`;

};

const TA={

  const w=S.world,b=bk();let n=a==='all'?Math.floor(b.bal):+a;n=Math.min(n,Math.floor(b.bal));if(n<=0)return;
  const fee=(where()===HT||where()==='gildenreach')?0:Math.max(1,Math.round(n*.01));

 bborrow(a){
  const b=bk();if(b.debt>0.5){note('Settle your current loan first.','e');return;}
  const lim=loanLimit();let n=a==='max'?lim:Math.round(lim*(+a));n=Math.max(0,Math.min(n,lim));if(n<50)return;
  b.debt=n;b.due=60;b.late=0;S.world.gold+=n;note(`🏦 The bank advances you ${fmt(n)}g. Repay within 60 days.`,'y');
 },
 brepay(a){
  const w=S.world,b=bk();if(b.debt<=0)return;let n=a==='all'?Math.ceil(b.debt):+a;n=Math.min(n,Math.ceil(b.debt),Math.floor(w.gold));if(n<=0)return;

 },
 bpaybal(){const b=bk();if(b.debt<=0||b.bal<=0)return;const n=Math.min(b.bal,Math.ceil(b.debt));b.bal-=n;ACT_brepayFrom(n);},
 binvest(p){

const DOING_BY=Object.fromEntries(DOINGS.map(d=>[d.id,d]));
const DAILY_DOINGS=6;
function todaysDoings(town){
 const t=T(),seed=(t.clock*7919+town.length*104729)%2147483647;
 const pool=DOINGS.filter(d=>d.towns.includes(town)&&!d.fest);
 const fest=t.ev.some(e=>e.kind==='festival'&&e.town===town);
 const must=pool.filter(d=>['temple','bath','fortune'].includes(d.id));
 const rest=pool.filter(d=>!must.includes(d));
 let r=seed,rnd2=()=>{r=(r*1103515245+12345)%2147483648;return r/2147483648;};
 const picks=rest.slice().sort(()=>rnd2()-.5).slice(0,Math.max(3,DAILY_DOINGS-must.length));
 let out=must.concat(picks);
 if(fest)out=out.concat(DOINGS.filter(d=>d.fest&&d.towns.includes(town)));
 return out;
}
function doneToday(town,id){return(S.hero.dn||{})[town+':'+id]===T().clock;}
function doDoing(id){
 const h=S.hero,w=S.world,p=P(),town=where(),d=DOING_BY[id],t=T();
 if(!d||doneToday(town,id)||S.dg)return;
 if(h.sta<d.sta){note('Too tired for that.','e');return;}
 if(w.gold<d.gold){note('You cannot afford it.','e');return;}
 if(d.lvl&&h.lvl<d.lvl){note('You are not ready for that.','e');return;}
 h.sta-=d.sta;w.gold-=d.gold;h.dn=h.dn||{};h.dn[town+':'+id]=t.clock;
 t.done=t.done||{};t.done[id]=(t.done[id]||0)+1;
 const lines=[];
 const stat=d.skill?p.st[d.skill]:0,need=4+h.lvl*.45;
 let ch=d.skill?clamp(.58+(stat-need)*.014,.38,.93):1;
 const win=Math.random()<ch,crit=win&&Math.random()<.12,x=crit?1.6:1,b=d.base;
 if(win){
  lines.push(pick(d.win));if(crit)lines.push('✨ <b>That went especially well.</b>');
  if(b.gold)lines.push(...applyOut({gold:b.gold*x},null).filter(l=>l.startsWith('💰')));
  if(b.xp)lines.push(...applyOut({xp:b.xp*x},null));
  if(b.mat)lines.push(...applyOut({mat:Math.round(b.mat*x)},null));
  if(b.pot)lines.push(...applyOut({pot:b.pot},null));
  if(b.item&&Math.random()<(d.id==='auction'?1:.5))lines.push(...applyOut({item:1},null));
  if(b.st)for(const k in b.st){const g=b.st[k]*x*(1+bgv('train'))*catchMult()/(1+h.st[k]/30);h.st[k]+=g;lines.push(`💪 ${STAT_NAME[k]} +${g.toFixed(2)}`);}
  if(b.heal){const n=healHero(Math.round(p.maxhp*.6));if(n)lines.push(`💚 +${n} HP`);}
  if(b.fx)lines.push(addFx(b.fx));
  if(b.rep)addRep(town,b.rep*x);
  if(b.tip){const tip=giveTip();if(tip)lines.push(tip);}
  if(b.mtip){const t2=TOWN_IDS.filter(x=>x!==town&&knowT(x));if(t2.length){const id2=pick(t2),g=pick(TOWNS[id2].produce.concat(TOWNS[id2].demand)),st=t.seen[id2]=t.seen[id2]||{};st[g]={p:Math.round(GOODS[g].b*t.mult[id2][g]),c:t.clock,hear:1};lines.push(`📊 ${GOODS[g].n} in ${TOWNS[id2].n}: about ${st[g].p}g a unit.`);}}
  if(b.cargo){const [g,n0]=b.cargo,n=Math.max(1,Math.round(n0*x)),room=Math.floor((cargoCap()-cargoUsed())/GOODS[g].w),q=Math.min(n,room);
   if(q>0){const c=t.cargo[g]=t.cargo[g]||{n:0,cost:0};c.n+=q;c.cost+=0;lines.push(`${GOODS[g].ic} +${q} ${GOODS[g].n.toLowerCase()} (your load: ${cargoUsed()}/${cargoCap()})`);}else lines.push(`Your load is full, so you leave the ${GOODS[g].n.toLowerCase()} behind.`);}
 }else{
  lines.push(pick(d.fail||['It does not go well.']));
  if(d.hurt){const n=Math.max(1,Math.round(p.maxhp*d.hurt));h.hp=Math.max(1,h.hp-n);lines.push(`💔 −${n} HP`);}
 }
 S.doRes={n:d.n,ic:d.ic,lines};
 const ledger=S.world.t.ledger=S.world.t.ledger||{};ledger.doings=(ledger.doings||0)+1;
}
Object.assign(ACT,{doDo(id){doDoing(id);}});
VIEWS.doings=function(){
 const town=where(),t=T(),list=todaysDoings(town),h=S.hero;
 let s=`<h1>📌 ${town===HT?'Notice Board':TOWNS[town].n+' Notices'}</h1><p class="mut sm">Odd jobs, errands, and local distractions. The board changes every day, so if something is not here, check back.</p>`;
 if(S.doRes){const r=S.doRes;S.doRes=null;s+=`<div class="card"><b>${r.ic} ${r.n}</b>${r.lines.map(l=>`<p>${l}</p>`).join('')}</div>`;}
 s+=list.map(d=>{const dn=doneToday(town,d.id),cant=dn||h.sta<d.sta||S.world.gold<d.gold||(d.lvl&&h.lvl<d.lvl);
  const cost=[d.sta?d.sta+'⚡':'',d.gold?d.gold+'g':''].filter(Boolean).join(' · ')||'free';
  return `<div class="card sm"><div class="row2"><b>${d.ic} ${d.n}</b><span class="tag">${dn?'done today':cost}</span></div><div class="mut">${d.d}</div>${btn('Do it','doDo',d.id,'c',cant,d.lvl&&h.lvl<d.lvl?'Needs level '+d.lvl:'')}</div>`;}).join('');
 return s+btn('← Back','go','town','c');
};

const SKRANK=['Drizzle','Gale','Squall','Tempest','Cataclysm'],SKRC=['#9aa3b5','#c58a4a','#cfd6e4','#f0c94a','#7fe0ff'];

const skEdge=e=>{try{return({1:.6,2:1,3:1.35,4:1.7}[danger(e)[2]]||1);}catch(x){return 1;}};
const SKPERK=['Drizzle: the basics.','Gale: costs 1 less Focus.','Squall: +15% damage.','Tempest: a 20% chance to refund half the Focus.','Cataclysm: +15% more damage, and the refund chance rises to 30%.'];
function skillUse(id){
 const h=S.hero;h.su=h.su||{};h.sx=h.sx||{};h.skReady=h.skReady||{};
 h.su[id]=(h.su[id]||0)+1;
 const ks=Object.keys(h.skills),mean=ks.reduce((a,k)=>a+(h.su[k]||0),0)/Math.max(1,ks.length);
 const even=clamp((mean+1)/(h.su[id]),.25,2),weight=Math.sqrt(SK[id].c/3),edge=S.cb&&S.cb.e?skEdge(S.cb.e):1;
 h.sx[id]=(h.sx[id]||0)+even*weight*edge*(1+bgv('mastery')+.05*estLv('train','academy'));
 const l=h.skills[id],need=skNeed(l);let msg=null;
 if(l<SKMAX&&h.sx[id]>=need){
  if(skCapped(l)){h.sx[id]=need;if(!h.skReady[id]){h.skReady[id]=1;msg=`⚡ <b>${SK[id].n}</b> has reached the limit of its rank. It is ready for a breakthrough (Hero tab).`;}}
  else{h.sx[id]-=need;h.skills[id]=l+1;msg=`📈 <b>${SK[id].n}</b> improves through use: Lv ${l+1}!`;}
 }
 const r=skRank(h.skills[id]);
 if(S.cb&&r>=3&&Math.random()<(r>=4?.3:.2)){const rf=Math.ceil(skillCost(id)/2);S.cb.focus+=rf;msg=(msg?msg+' ':'')+`✨ ${SK[id].n} flows easily. +${rf} Focus back.`;}
 return msg;

const hagMax=()=>3+Math.floor(lsLvl('haggle')/4);
const hagLeft=()=>{const h=S.hero;return h.hag&&h.hag.d===h.day?Math.max(0,hagMax()-h.hag.n):hagMax();};
const hprice=it=>(it.hgd===S.hero.day&&it.hg)?it.hg:sellVal(it);
const hagChance=()=>{const p=P(),h=S.hero;return clamp(.38+p.int*.006+p.st.agi*.004+lsLvl('haggle')*.012,.3,.9);};
function hagDo(id){
 const f=findItem(id);if(!f||f.where!=='inv')return;
 const g=hprice(f.it);S.world.gold+=g;ACT._rm(f);S.hagMsg=`Sold ${esc(f.it.name)} for ${g}g.`;
}
Object.assign(ACT,{
 hag(id){
  const h=S.hero,f=findItem(id);if(!f||f.where!=='inv')return;const it=f.it;
  if(it.lock){S.hagMsg='That item is locked.';return;}
  if(it.hgd===h.day){S.hagMsg='You already bargained over that one today.';return;}
  if(hagLeft()<1){S.hagMsg='The merchant has had enough bargaining for one day.';return;}
  h.hag={d:h.day,n:(h.hag&&h.hag.d===h.day?h.hag.n:0)+1};it.hgd=h.day;
  if(Math.random()<hagChance()+(it.appr?.1:0)){
   it.hg=Math.max(sellVal(it)+1,Math.round(it.val*(.55+Math.random()*.12+lsLvl('haggle')*.004)*sellMult()));
   S.hagMsg=`The merchant sighs and agrees to ${it.hg}g for ${esc(it.name)}.`;
   lsUse('haggle',true);
  }else{
   it.hg=Math.max(1,Math.round(it.val*.38));S.hagMsg=`"Not for that." The merchant drops the offer on ${esc(it.name)} to ${it.hg}g.`;lsUse('haggle',false);
  }
 },
 hsell(id){
  const f=findItem(id);if(!f||f.where!=='inv')return;
  if(f.it.lock){S.hagMsg='That item is locked. Unlock it in the Pack first.';return;}
  if(f.it.rar>=2){S.hsId=id;S.modal={t:'confirm',a:'hsellYes',q:`Sell ${esc(f.it.name)} (${RAR[f.it.rar].n}) for ${hprice(f.it)}g?`};return;}
  hagDo(id);
 },
 hsellYes(){S.modal=null;const id=S.hsId;S.hsId=null;if(id!=null)hagDo(id);},
 sellWorse(){
  const h=S.hero,L=S.world.inv.filter(it=>!it.lock&&it.rar<3&&h.equip[it.slot]&&upDiff(it)<=0);
  if(!L.length){S.hagMsg='Nothing in your pack is worse than what you wear.';return;}
  S.modal={t:'confirm',a:'sellWorseYes',q:`Sell ${L.length} item${L.length>1?'s':''} no better than what you wear, for ${L.reduce((a,i)=>a+hprice(i),0)}g? Locked items are kept.`};
 },
 sellWorseYes(){
  S.modal=null;const h=S.hero;let g=0,n=0;
  S.world.inv=S.world.inv.filter(it=>{if(!it.lock&&it.rar<3&&h.equip[it.slot]&&upDiff(it)<=0){g+=hprice(it);n++;return false;}return true;});
  S.world.gold+=g;S.hagMsg=`Sold ${n} item${n===1?'':'s'} for ${g}g.`;
 }
});

 });

 let hs=0;for(const c of String(id))hs=(hs*31+c.charCodeAt(0))>>>0;
 const SKIN=['#f0cfae','#e0b48c','#c58f64','#9a6842','#6e4a30'],HAIR=['#2b2118','#5a3a22','#8a5a2b','#c9a24a','#9a9aa4','#7a2a1a'];
 const s=P.skin||SKIN[hs%5],h=HAIR[(hs>>3)%6];
 let g=`<circle cx="32" cy="32" r="32" fill="${P.bg}"/>`;
 if(P.pre)g+=P.pre;
 if(P.back)g+=P.back(s,h);
 g+=`<path d="M6 64C8 48 20 43 32 43s24 5 26 21z" fill="${P.cloth}"/><rect x="28" y="36" width="8" height="9" fill="${s}"/><path d="M28 43l4 5 4-5" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.500"/>`;
 if(P.machine){
  g+=`<path d="M32 15V8" stroke="#b9bdc6" stroke-width="2"/><circle cx="32" cy="7" r="2.200" fill="#ff7a4a"/><rect x="20" y="15" width="24" height="22" rx="4" fill="#a2a7b0"/><rect x="24" y="22" width="6" height="5" rx="1" fill="#ffcf4a"/><rect x="34" y="22" width="6" height="5" rx="1" fill="#ffcf4a"/><path d="M25 32h14M25 34.500h14" stroke="#6a6e78" stroke-width="1.200"/>`;
 }else{
  g+=`<ellipse cx="32" cy="28" rx="11" ry="13" fill="${s}"/>`;
  g+=(P.top||PORT._.top)(s,h);
  const ec=P.eyes||'#1a1410',r=P.big?2.2:1.400;
  g+=`<circle cx="27.500" cy="28" r="${r}" fill="${ec}"/><circle cx="36.500" cy="28" r="${r}" fill="${ec}"/><path d="M29 35q3 1.800 6 0" fill="none" stroke="rgba(40,20,10,.65)" stroke-width="1.200" stroke-linecap="round"/>`;
  if(P.front)g+=P.front(s,h);
 }
 return `<svg class="cpic" width="${sz}" height="${sz}" viewBox="0 0 64 64" role="img" aria-label="${esc(D.n||'Companion')}">${g}</svg>`;
}

const LS_MAX=15,lsNeed=l=>5+3*l;
const LSK={
 haggle:{n:'Haggling',d:'Getting a better price out of a merchant.',eff:l=>`+${(l*1.2).toFixed(1)}% odds of a better price · ${3+Math.floor(l/4)} tries a day · offers up to +${(l*.4).toFixed(1)}% of an item's worth better`},
 carouse:{n:'Carousing',d:'Buying a round and loosening the right tongues.',eff:l=>`${Math.round(Math.min(.95,.55+.035*l)*100)}% chance a round gets someone talking · rounds cost ${Math.min(30,3*l)}% less · ${l*4}% chance of a second rumour`},
 bluff:{n:'Bluffing',d:'Talking your way past tolls and trouble.',eff:l=>`+${(l*.8).toFixed(1)}% to every bluff`}

function lsRec(id){
 const h=S&&S.hero;if(!h)return null;h.ls=h.ls||{};
 if(id==='haggle'&&h.hagw&&!h.ls.haggle)h.ls.haggle={x:h.hagw*3,u:h.hagw,s:h.hagw};
 return h.ls[id]||null;
}
function lsProg(id){const r=lsRec(id);if(!r)return{l:0,x:0,need:lsNeed(0)};let x=r.x,l=0;while(l<LS_MAX&&x>=lsNeed(l)){x-=lsNeed(l);l++;}return{l,x:l>=LS_MAX?0:x,need:lsNeed(l)};}
const lsLvl=id=>lsProg(id).l;
function lsUse(id,ok,x){
 const h=S.hero;if(!h||!LSK[id])return;
 let r=lsRec(id);
 if(!r){r=h.ls[id]={x:0,u:0,s:0};note(`New skill: ${LSK[id].n}. You can track it in the Hero tab, under Skills log.`,'y');}
 const b=lsLvl(id);r.u++;if(ok)r.s++;r.x+=(x!=null?x:ok?3:1);
 const a=lsLvl(id);if(a>b)note(`${LSK[id].n} improves to level ${a}.`,'g');
}
const carChance=()=>clamp(.55+.035*lsLvl('carouse'),.55,.95);
const rumorCost=()=>Math.round((15+S.hero.lvl*4)*(1-Math.min(.3,.03*lsLvl('carouse'))));
Object.assign(ACT,{
 rumor(){

  if(w.gold<cost){note('Not enough gold for rumors.','e');return;}
  w.gold-=cost;const ok=Math.random()<carChance();let t=null;
  if(ok){t=giveTip();if(t&&Math.random()<lsLvl('carouse')*.04){const t2=giveTip();if(t2)t+='<br>'+t2;}}
  S.rumor=(t||(ok?'Plenty of talk, none of it new.':pick(['The round goes down well. The conversation goes nowhere.','Everyone thanks you and says very little.','A lot of nodding. Nobody knows anything.'])))+` <span class="mut">(−${cost}g)</span>`;
  lsUse('carouse',ok);
 }
});
{

 ACT.listen=function(){const h=S.hero,done=h.lstDay===h.day;_l.call(this);if(!done)lsUse('carouse',/<b>/.test(S.rumor||''),/<b>/.test(S.rumor||'')?2:1);};

function slogHtml(){

 let t=`<h1>Skills log</h1><p class="mut sm">You get better at things by doing them. Each success teaches more than a failure. Heirs keep a little of what their forebears learned (hereditary growth). New skills appear here the first time you try something.</p>`;
 if(!ids.length&&!(T().tx>0))t+='<div class="card sm mut">Nothing yet. Bargain with a merchant, buy a round at the tavern, or talk your way out of trouble.</div>';

 });
 if(T().tx>0){const l=tradeLv();t+=`<div class="card"><div class="row2"><b>Trading</b><span class="tag">Level ${l}/7</span></div><div class="mut sm">Buying low and selling high, town to town.</div><div class="sm" style="margin-top:6px"><span class="mut">Now:</span> ${Math.round(spreadF()*1000)/10}% price spread · ${cargoCap()} cargo space</div></div>`;}
 return t;
}

/* =====================================================================

   and rank is what lets you grow past a level

const RAR_MINIL=[0,3,16,36];
function rarGov(il,rar,raw){
 rar=clamp(rar|0,0,3);
 while(rar>0&&il<RAR_MINIL[rar])rar--;
 if(!raw){const sc=clamp(.6-il*.008,.15,.6);while(rar>0&&Math.random()<sc)rar--;}
 return rar;
}
function shopRar(il,nu,rich){rich=rich||1;
 const tr=keeperTier();let r=0;
 if(nu<(il<20?1:2)&&Math.random()<Math.min(.3,(.05+il*.003)*rich))r=1;
 if(tr>=2&&il>=16&&Math.random()<.02*(tr-1)*rich)r=2;
 return r;
}
{
 const _gen=genItem;
 genItem=function(il,rar,slot,raw){return _gen(il,rarGov(il,rar,raw),slot);};
}

// ---------- rank sets the ceiling on levels ----------
const LV_CAP=[10,20,30,40,52,66,99];
const lvCap=()=>LV_CAP[rankIdx(S.hero.contracts)]||99;
const rankName=()=>RANKS[rankIdx(S.hero.contracts)].n;
addXP=function(n){
 const h=S.hero,out=[];h.xp+=n;
 while(h.xp>=xpNeed(h.lvl)){
  if(h.lvl>=lvCap()){
   h.xp=xpNeed(h.lvl)-1;
   if(h.capDay!==h.day){h.capDay=h.day;const nx=RANKS[rankIdx(h.contracts)+1];out.push(`You have reached the limit of your rank (Level ${lvCap()}).${nx?` Reach ${nx.n} rank at the guild to grow further.`:''}`);}
   break;
  }
  h.xp-=xpNeed(h.lvl);h.lvl++;STATS.forEach(k=>h.st[k]+=1);h.pts+=3;
  h.hp=Math.min(P().maxhp,h.hp+Math.round(P().maxhp*.25));
  out.push(`⭐ Level ${h.lvl}! (+3 stat points)`);buzz([60,40,60]);
 }
 if(out.some(l=>/Level \d+!/.test(l)))sfx('level');
 return out;
};
{

 const _mi=monIcon;
 monIcon=function(e,size){
  size=size||48;const n=e.name||e.base||'?',tier=e.tier||'n';
  const base=(e.base||n).replace(/^(Alpha|Ravenous|Ancient|Frenzied|Elder|Dread|Savage|Abyssal|Echo of) /,'').replace(/ Pack$/,'');
  const src=MONPIC[base]||MONPIC[n];
  if(!src)return _mi(e,size);
  const ring=tier==='b'?'#ff6b6b':tier==='e'?'#f0b94a':'#2b3140';
  return `<img class="mpic" src="${src}" width="${size}" height="${size}" alt="" style="border-color:${ring};border-width:${tier==='n'?1:2}px">`;
 };
}

/* ---------- quick reward pop-up ---------- */
function popReward(title,lines,ms){
 if(typeof document==='undefined')return;
 try{
  const old=document.getElementById('rewpop');if(old)old.remove();
  const el=document.createElement('div');el.id='rewpop';
  el.innerHTML=`<b>${title}</b>${(lines||[]).map(l=>`<p>${l}</p>`).join('')}`;
  ms=ms||2500;el.style.animationDuration=ms+'ms';
  el.addEventListener('click',()=>el.remove());
  document.body.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove();},ms+200);
  // if the same words are already on the screen, the pop-up is only noise
  setTimeout(()=>{try{
   const norm=s=>String(s).replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').toLowerCase().replace(/[^a-z0-9]+/g,'');
   const v=norm((document.getElementById('view')||{}).innerText||'');
   const ls=(lines||[]).map(norm).filter(x=>x.length>=5);
   if(ls.length&&ls.every(x=>v.includes(x.slice(0,40)))&&el.parentNode)el.remove();
  }catch(e){}},80);
 }catch(e){}
}
{
 const _dd=ACT.doDo;
 ACT.doDo=function(id){S.doRes=null;_dd.call(this,id);if(S.doRes)popReward(`${S.doRes.ic} ${S.doRes.n}`,S.doRes.lines);};
 const chatMs=ls=>clamp(4000+(ls||[]).join(" ").replace(/<[^>]+>/g,"").length*40,5500,10000);
 const _nt=ACT.npcTalk;
 ACT.npcTalk=function(id){S.npcRes=null;_nt.call(this,id);if(S.npcRes){popReward(esc(S.npcRes.who.n),S.npcRes.lines,chatMs(S.npcRes.lines));S.npcRes=null;}};
 const _kt=ACT.kpTalk;

 }

function showAnn(){
 if(typeof document==='undefined')return;
 if(document.getElementById('annpop'))return;
 const q=S.annQ||[];if(!q.length)return;
 const scr=S.screen;if(['combat','death','dg','explore','enc','trip','puzzle','delve','convo','talk','result'].includes(scr)||S.modal)return;
 const w=S.world,h=S.hero,FREE=['first_train','first_sleep','first_kill','first_level','seasons'];
 // spaced out: apart from the first steps, one announcement per three kills or two days
 const ok=id=>FREE.includes(id)||w.annK==null||(w.kills-w.annK>=3)||(h.day-(w.annD||0)>=2);
 const qi=q.findIndex(ok);if(qi<0)return;
 const u=UNLOCKS.find(x=>x.id===q[qi]);q.splice(qi,1);if(!u)return;
 if(!FREE.includes(u.id)){w.annK=w.kills;w.annD=h.day;}

/* =====================================================================
   Cloud save: a private copy of your game kept with your account, so
   closing the app or clearing the browser does not lose it
   ===================================================================== */
const CLOUD={ready:false,db:null,id:null,st:'off',t:0,sent:'',busy:false,timer:null,err:''};
const CLOUD_CHUNK=80000,LT_KEY='tq_bloodline_t';
const cloudDoc=(i)=>CLOUD.db.doc('data/users/'+CLOUD.id+'/'+(i==null?'cloud':'cloud_'+i));
async function cloudPull(){
 const m=await cloudDoc().get();
 if(!m.exists){CLOUD.st='ok';if(S||window.__save)cloudSchedule();return;}
 const meta=m.data(),lt=+(localStorage.getItem(LT_KEY)||0);
 CLOUD.t=meta.t||0;
 if(!meta.n||meta.t<=lt+1500){CLOUD.st='saved';return;}
 // the cloud copy is newer than anything on this device: use it if the game is not running
 if(S)return;
 let s='';for(let i=0;i<meta.n;i++){const c=await cloudDoc(i).get();if(!c.exists)throw new Error('missing part');s+=c.data().d;}
 const o=JSON.parse(s);if(!(o&&o.world&&o.hero))throw new Error('bad copy');
 window.__save=o;CLOUD.sent=s;CLOUD.st='restored';
 try{localStorage.setItem(SAVE_KEY,s);localStorage.setItem(LT_KEY,String(meta.t));}catch(e){}
 try{render();}catch(e){}
}
async function cloudPush(){
 if(!CLOUD.ready||CLOUD.busy||!S||!S.world||!S.hero)return;
 CLOUD.timer=null;
 let s;try{s=JSON.stringify(S);}catch(e){return;}
 if(s===CLOUD.sent){return;}
 CLOUD.busy=true;
 try{
  const n=Math.ceil(s.length/CLOUD_CHUNK),t=Date.now();
  for(let i=0;i<n;i++)await cloudDoc(i).set({d:s.slice(i*CLOUD_CHUNK,(i+1)*CLOUD_CHUNK)});
  await cloudDoc().set({t,n,len:s.length});
  try{localStorage.setItem(LT_KEY,String(t));}catch(e){}
  CLOUD.sent=s;CLOUD.t=t;CLOUD.st='saved';CLOUD.err='';
 }catch(e){CLOUD.st='fail';CLOUD.err=(e&&e.code)||'error';}
 CLOUD.busy=false;
}
function cloudSchedule(){
 if(!CLOUD.ready||CLOUD.timer)return;
 CLOUD.timer=setTimeout(cloudPush,6000);
}
{
 const _sv=save;
 save=function(){_sv.apply(this,arguments);try{localStorage.setItem(LT_KEY,String(Date.now()));}catch(e){}cloudSchedule();};
 const _ry=ACT.resetYes;
 ACT.resetYes=function(){_ry.apply(this,arguments);try{if(CLOUD.ready){CLOUD.sent='';cloudDoc().delete();}}catch(e){}};
 if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(CLOUD.timer){clearTimeout(CLOUD.timer);CLOUD.timer=null;}cloudPush();}});
  window.addEventListener('pagehide',()=>{cloudPush();});
 }
 const _mn=VIEWS.menu;
 VIEWS.menu=function(){
  let t=_mn();
  const txt={off:'Cloud save is not available here. Your save lives only on this device: use Copy save as text (Menu) to keep a copy.',ok:'Cloud save is on. It will save after your next action.',saved:'Cloud save is on. Last saved '+(CLOUD.t?new Date(CLOUD.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'')+'.',restored:'Your game was restored from your cloud save.',fail:'Cloud save failed ('+CLOUD.err+'). Your game is still saved on this device. Use Copy save as text for a safe copy.'}[CLOUD.st]||'';
  return t.replace(/(<\/h1>)/,`$1<div class="card sm" style="border-color:${CLOUD.st==='fail'?'var(--bad)':CLOUD.st==='off'?'var(--line)':'var(--good)'}">☁️ ${esc(txt)}</div>`);
 };
}
async function cloudInit(){
 try{
  if(typeof window==='undefined'||!window.claude||!window.claude.use)return;
  const db=await window.claude.use('db'),user=await window.claude.use('user');
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  CLOUD.db=db;CLOUD.id=id;CLOUD.ready=true;CLOUD.st='ok';
