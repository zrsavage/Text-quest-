<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Hollowmere: Bloodline</title>
<style>
:root{--bg:#0f1218;--panel:#1a1f2a;--panel2:#232a38;--line:#2d3649;--tx:#e8ecf3;--mut:#8b95a7;--acc:#f0b94a;--good:#5fd38d;--bad:#ff6b6b;--blue:#4aa3ff;--purple:#c077ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:5;background:#121620;border-bottom:1px solid var(--line);padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
#top .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
#top b{color:var(--tx)}
#view{flex:1;padding:12px 14px 96px}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;display:flex;background:#121620;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 2px 8px;font-size:11px;position:relative;min-height:54px}
#nav button span{display:block;font-size:20px;line-height:1.1}
#nav button.on{color:var(--acc)}
#nav .dot{position:absolute;top:6px;right:22%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:16px 0 6px;color:var(--acc)}h3{font-size:15px;margin:10px 0 4px}
p{margin:6px 0}.mut{color:var(--mut)}.sm{font-size:13px}.c{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.btn small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.btn:active{filter:brightness(1.3)}
.btn[disabled]{opacity:.4}
.btn.pri{background:#3a2f12;border-color:var(--acc);color:var(--acc)}
.btn.bad{background:#3a1717;border-color:var(--bad);color:var(--bad)}
.btn.good{background:#143324;border-color:var(--good);color:var(--good)}
.btn.c{text-align:center}
.bar{height:12px;background:#0b0e14;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:3px 0}
.bar i{display:block;height:100%}
.hp i{background:linear-gradient(90deg,#c0392b,#ff6b6b)}.ehp i{background:linear-gradient(90deg,#8e2b2b,#e65a5a)}
.fc i{background:linear-gradient(90deg,#2f6fb5,#4aa3ff)}.xp i{background:linear-gradient(90deg,#8a6d1e,#f0b94a)}.sta i{background:linear-gradient(90deg,#2d8a58,#5fd38d)}
.log{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;max-height:200px;overflow:auto}
.log div{margin:2px 0;color:#c9d1de}.log div.e{color:#ff9a9a}.log div.g{color:var(--good)}.log div.y{color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mut);margin-left:4px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:6px 0;cursor:pointer;min-height:48px}
.item .n{font-weight:600;font-size:14px}.item .s{font-size:12px;color:var(--mut)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:#171c27;border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88dvh;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
input[type=text],textarea{width:100%;background:#0b0e14;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px;font-size:16px}
textarea{height:110px;font-size:12px}
.up{color:var(--good)}.dn{color:var(--bad)}
.skull{letter-spacing:2px}

#sleepfx{position:fixed;inset:0;z-index:50;overflow:hidden;background:#0b1030;animation:fxout .5s ease 3.9s forwards}
#sleepfx>*{position:absolute;pointer-events:none}
#sleepfx .sky{inset:0;opacity:0}
#sleepfx .day{background:linear-gradient(#5fb0ff,#bfe3ff);animation:skyday 4.4s linear forwards;opacity:1}
#sleepfx .dusk{background:linear-gradient(#2b1a5a,#ff7a3c 70%,#ffd27a);animation:skydusk 4.4s linear forwards}
#sleepfx .night{background:linear-gradient(#050818,#101a4a);animation:skynight 4.4s linear forwards}
#sleepfx .dawn{background:linear-gradient(#3a3f8f,#ff9b6a 75%,#ffe3a1);animation:skydawn 4.4s linear forwards}
#sleepfx .stars{inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 35%,#fff,transparent),radial-gradient(2px 2px at 55% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 28%,#fff,transparent),radial-gradient(2px 2px at 88% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 52%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 48%,#fff,transparent),radial-gradient(2px 2px at 45% 42%,#fff,transparent);opacity:0;animation:starsfx 4.4s linear forwards}
#sleepfx .sun{left:50%;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:radial-gradient(circle,#fff6c9 30%,#ffc94a 70%);box-shadow:0 0 60px 20px rgba(255,190,70,.6);animation:sunfx 4.4s ease-in-out forwards}
#sleepfx .moon{left:68%;top:20%;width:46px;height:46px;border-radius:50%;background:#f2f0e6;box-shadow:inset -12px -4px 0 0 #cfcab8,0 0 30px 8px rgba(220,230,255,.35);opacity:0;animation:moonfx 4.4s linear forwards}
#sleepfx .hills{left:-10%;right:-10%;bottom:-2%;height:30%;background:#0a0d18;border-radius:50% 50% 0 0/100% 100% 0 0;box-shadow:0 0 0 100vh #0a0d18 inset;z-index:2}
#sleepfx .town{left:0;right:0;bottom:calc(30% - 6px);text-align:center;font-size:30px;letter-spacing:6px;z-index:2;opacity:.9;filter:grayscale(1) brightness(.2)}
#sleepfx .stxt{left:0;right:0;top:12%;text-align:center;z-index:3;color:#fff;font-size:20px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#sleepfx .stxt span{position:absolute;left:0;right:0;opacity:0}
#sleepfx .t1{animation:txt1 4.4s linear forwards}#sleepfx .t2{animation:txt2 4.4s linear forwards}
@keyframes skyday{0%{opacity:1}30%{opacity:0}100%{opacity:0}}
@keyframes skydusk{0%{opacity:0}15%{opacity:1}42%{opacity:1}55%{opacity:0}100%{opacity:0}}
@keyframes skynight{0%,30%{opacity:0}48%{opacity:1}62%{opacity:1}75%{opacity:0}100%{opacity:0}}
@keyframes skydawn{0%,62%{opacity:0}78%{opacity:1}100%{opacity:1}}
@keyframes starsfx{0%,30%{opacity:0}48%{opacity:1}62%{opacity:1}78%{opacity:0}100%{opacity:0}}
@keyframes sunfx{0%{top:14%;filter:none}38%{top:66%;filter:hue-rotate(-20deg) saturate(1.4)}50%{top:90%}62%{top:90%}95%{top:42%}100%{top:36%}}
@keyframes moonfx{0%,35%{opacity:0;transform:translateY(30px)}50%,62%{opacity:1;transform:none}72%,100%{opacity:0}}
@keyframes txt1{0%,5%{opacity:0}15%,40%{opacity:1}52%,100%{opacity:0}}
@keyframes txt2{0%,68%{opacity:0}80%,100%{opacity:1}}
@keyframes fxout{to{opacity:0}}
@media (prefers-reduced-motion:reduce){#sleepfx,#sleepfx *{animation-duration:1.2s!important;animation-delay:0s!important}}
.dgmap{display:grid;gap:4px;margin:10px 0}.dgc{aspect-ratio:1;max-height:50px;background:#0b0e14;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px}.dgc.k{background:var(--panel)}.dgc.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.dgc.done{opacity:.5}
.dgpad{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;align-items:center;margin-top:8px}.dgpad .btn{padding:8px 4px;font-size:13px}.dgme{text-align:center;font-size:26px}
</style>
</head>

 str:{l:'STR',w:3,f:i=>1+i*.32,pre:['Brutal','Mighty','Savage',"Titan's"],suf:['of Strength','of the Bear','of Might']},

 weapon:[['Sword',{atk:1}],['Axe',{atk:1.15}],['Mace',{atk:1.05,def:.25}],['Dagger',{atk:.8,crit:.5}],['Spear',{atk:1,agi:.12}],['Staff',{atk:.7,int:.18}],['Bow',{atk:.9,agi:.16}]],

};
function baseStat(k,i,m){
 if(k==='atk')return Math.round((6+i*2.8)*m);
 if(k==='def')return Math.round((3+i*1.1)*m);
 if(k==='hp')return Math.round((10+i*4)*m);
 if(k==='crit')return Math.round(8*m*10)/10;
 if(k==='dodge')return Math.round(4*m*10)/10;
 return Math.max(1,Math.round((1+i*.3)*m));
}
const VAL_MULT=[1,2,4.5,9,30];

/* ----- hand-made legendaries ----- */
const LEGENDS=[
 {k:'locket',n:"Gravewalker's Locket",slot:'amulet',il:5,b:{hp:1.4,vit:.6},fx:{regen:2},sp:'bloodline',lore:'Worn by every heir who walked before you.'},

/* ---------------- derived stats ---------------- */
function gearTotals(){const g={};for(const s of SLOTS){const it=S.hero.equip[s];if(it)for(const k in it.st)g[k]=(g[k]||0)+it.st[k];}return g;}
function hasSpecial(sp){return SLOTS.some(s=>S.hero.equip[s]&&S.hero.equip[s].sp===sp);}
function rankIdx(c){let r=0;RANKS.forEach((x,i)=>{if(c>=x.c)r=i;});return r;}
function P(){
 const h=S.hero,g=gearTotals(),st={};
 STATS.forEach(k=>st[k]=Math.floor(h.st[k])+(g[k]||0));
 const ren=1+Math.min(.6,h.contracts*.012);
 const p={st,ren};
 p.maxhp=Math.round((40+st.vit*6+h.lvl*5+(g.hp||0))*ren);
 p.atk=Math.round((st.str*2+(g.atk||0)+(S.hero.equip.weapon?0:2))*ren);
 p.def=Math.round((st.vit*.8+(g.def||0))*ren);
 p.crit=clamp(5+st.agi*.2+(g.crit||0),0,75);
 p.critdmg=150+(g.critdmg||0);
 p.dodge=clamp(st.agi*.25+(g.dodge||0),0,45);
 p.lifesteal=clamp(g.lifesteal||0,0,25);
 p.thorns=clamp(g.thorns||0,0,100);
 p.goldf=g.goldf||0;p.dropf=g.dropf||0;p.xpf=g.xpf||0;p.regen=Math.round(g.regen||0);
 p.int=st.int;
 p.maxfocus=10+Math.floor(st.int/2)+(g.maxfocus||0);
 p.maxsta=10+Math.floor(st.vit/6)+rankIdx(h.contracts)*2;
 let am=0,dm=0,hm=0;(h.fx||[]).forEach(f=>{const d=FX[f.id];if(!d)return;am+=d.atk||0;dm+=d.def||0;hm+=d.hp||0;p.crit+=d.crit||0;p.dodge+=d.dodge||0;p.goldf+=d.goldf||0;p.dropf+=d.dropf||0;});
 if(am)p.atk=Math.round(p.atk*(1+am));if(dm)p.def=Math.round(p.def*(1+dm));
 hm+=wf('healer')?.05:0;if(hm)p.maxhp=Math.round(p.maxhp*(1+hm));
 if(wf('orphan'))p.goldf+=5;if(wf('pip'))p.dropf+=5;if(wf('bard'))p.xpf+=5;
 return p;
}
function catchMult(){
 const w=S.world,h=S.hero;if(w.bestLevel<=h.lvl)return 1;
 let m=1+Math.min(1.5,(w.bestLevel-h.lvl)/w.bestLevel*2.5);

 return m;
}

function itemFromBases(slot,il,bs,m){const st={};for(const k in bs)st[k]=baseStat(k,il,bs[k]*m);return st;}
function genItem(il,rar,slot){
 slot=slot||SLOTS[wroll([3,2,2,2,1.5,1.5])];
 const [bn,bs]=pick(BASES[slot]),t=tierOf(il),st={};
 for(const k in bs)st[k]=baseStat(k,il,bs[k]);
 const n=[0,1,2,3][rar],used=[];
 while(used.length<n){
  const k=AFK[wroll(AFK.map(x=>AF[x].w))];
  if(used.includes(k))continue;
  if(k==='atk'&&slot!=='weapon'&&Math.random()<.7)continue;
  used.push(k);
 }
 const m=[1,1,1.12,1.3][rar];
 used.forEach(k=>{const a=AF[k];let v=a.f(il)*rnd(.8,1.2)*m;v=a.pct?Math.round(v*10)/10:Math.max(1,Math.round(v));st[k]=Math.round(((st[k]||0)+v)*10)/10;});
 const pre=n>=1?pick(AF[used[0]].pre):'',suf=n>=2?pick(AF[used[1]].suf):'';
 const name=[pre,TIER_ADJ[t],bn,suf].filter(Boolean).join(' ')+(n>=3?' ✦':'');
 return{id:uid(),slot,name,il,tier:t,rar,req:Math.max(1,il-2),st,val:Math.round((8+il*3.5)*VAL_MULT[rar])};
}

}
const rarName=it=>`<span style="color:${RAR[it.rar].c}">${esc(it.name)}</span>`;
function statLine(k,v){const a=AF[k];return `+${v}${a.pct?'%':''} ${a.l}`;}
function score(it){if(!it)return 0;const s=it.st;let t=0;for(const k in s){const w={atk:1.2,def:1.3,hp:.25,str:2.4,vit:2,agi:2,int:2,crit:3,critdmg:1,dodge:3,lifesteal:6,thorns:1.2,goldf:.5,dropf:.5,xpf:.6,regen:3,maxfocus:1}[k]||1;t+=s[k]*w;}return Math.round(t);}
function rollRarity(ws,boost){const w=ws.slice();for(let i=1;i<w.length;i++)w[i]*=boost||1;return wroll(w);}

 if(w.inv.length>=INV_MAX){w.gold+=sellVal(it);return 'full';}
 w.inv.push(it);return 'ok';

function findItem(id){const w=S.world;id=+id;let it=w.inv.find(x=>x.id===id);if(it)return{it,where:'inv'};for(const s of SLOTS){const e=S.hero.equip[s];if(e&&e.id===id)return{it:e,where:'eq'};}return null;}

/* ---------------- leveling ---------------- */
function addXP(n){
 const h=S.hero,out=[];h.xp+=n;
 while(h.xp>=xpNeed(h.lvl)){
  h.xp-=xpNeed(h.lvl);h.lvl++;STATS.forEach(k=>h.st[k]+=1);h.pts+=3;
  h.hp=Math.min(P().maxhp,h.hp+Math.round(P().maxhp*.25));
  out.push(`⭐ Level ${h.lvl}! (+3 stat points)`);
 }
 return out;
}

/* ---------------- contracts ---------------- */
function genContract(ri_){
 const zi=ri(Math.max(0,ri_-2),Math.min(ri_,5)),z=ZONES[zi],lvl=(z.min+z.max)/2;
 const dgs=DUNGEONS.filter(d=>!d.dyn&&S.world.map&&S.world.map.found[d.id]&&d.zi<=ri_);
 let type=pick(['kill','kill','kill','boss','gather']);if(dgs.length&&Math.random()<.18)type='dungeon';
 const c={id:S.world.nextId++,type,zi,prog:0,rankReq:Math.min(zi,ri_)};
 if(type==='kill'){
  c.n=ri(8,14);c.target=Math.random()<.5?'any':pick(z.mon).n;
  c.text=`Slay ${c.n} ${c.target==='any'?'monsters':c.target+'s'} in ${z.n}`;
  c.gold=Math.round(c.n*(10+lvl*4.2));c.xp=Math.round(c.n*(10+lvl*3.2)*.8);c.q=1;
 }else if(type==='boss'){
  c.n=1;c.text=`Defeat ${z.boss.n} (${z.n})`;
  c.gold=Math.round(80+lvl*45);c.xp=Math.round((10+lvl*3.2)*14);c.q=2;
 }else if(type==='dungeon'){
  const D=pick(dgs);c.zi=D.zi;c.dg=D.id;c.n=1;c.rankReq=Math.min(D.zi,ri_);c.text=`Clear ${D.n}`;
  c.gold=Math.round(120+D.lvl*55);c.xp=Math.round((10+D.lvl*3.2)*8);c.q=2;
 }else{
  c.n=ri(6,10);c.target=pick(z.mats);c.text=`Deliver ${c.n} × ${c.target}`;
  c.gold=Math.round(c.n*(8+lvl*3));c.xp=Math.round(c.n*(8+lvl*2.4));c.q=1;
 }
 return c;
}
function refreshBoard(){

 for(let i=0;i<5;i++)S.world.board.push(genContract(r));
}

/* ---------------- enemies ---------------- */
function makeEnemy(zi,boss,forceEl){
 const z=ZONES[zi],h=S.hero;
 const last=zi===ZONES.length-1,zmax=last?9999:z.max;
 let lvl=boss?(last?Math.max(z.max,h.lvl+1):z.max):clamp(h.lvl+ri(-1,2),z.min,zmax);
 const early=!boss&&zi===0&&h.kills<4&&!forceEl;
 let tpl=boss?z.boss:pick(z.mon);
 if(early){lvl=1;tpl=h.kills===0?z.mon[1]:pick([z.mon[0],z.mon[1]]);}
 const el=!boss&&(forceEl||(h.lvl>=3&&Math.random()<.12)),tier=boss?'b':el?'e':'n';
 if(el)lvl=Math.min(lvl+1,zmax+1);
 const hm={n:1,e:1.9,b:3.6}[tier]*(early?.55:1),am={n:1,e:1.3,b:1.5}[tier]*(early?.5:1);
 const base=14+13*lvl+.6*lvl*lvl;
 const hp=Math.round(base*tpl.hp*hm);
 return{name:(el?pick(['Alpha','Ravenous','Ancient','Frenzied'])+' ':'')+tpl.n,base:tpl.n,lvl,tier,zi,
  hp,max:hp,atk:Math.round((2.5+2.4*lvl+.08*lvl*lvl)*1.35*tpl.atk*am),def:Math.round((2+1.3*lvl)*tpl.def),
  pat:tpl.pat,pi:0,stun:0,poison:0,pd:0,buff:0};
}
function danger(e){
 const p=P(),h=S.hero;
 const avg=e.pat.split('').reduce((a,t)=>a+PAT_MULT[t],0)/e.pat.length;
 const hd=Math.max(1,p.atk*(1-mit(e.def,h.lvl)))*(1+p.crit/100*(p.critdmg/100-1));
 const ed=Math.max(1,e.atk*avg*(1-mit(p.def,e.lvl)))*(1-p.dodge/100);
 const r=(h.hp/ed)/(e.hp/hd);
 return r>=3?['Easy','var(--good)',1]:r>=1.8?['Fair','var(--acc)',2]:r>=1.15?['Risky','#ff9a3c',3]:['Deadly','var(--bad)',4];
}

/* ---------------- combat ---------------- */
function say(t,c){S.cb.log.push({t,c:c||''});if(S.cb.log.length>60)S.cb.log.shift();}
function healHero(n){const h=S.hero,m=P().maxhp;const b=h.hp;h.hp=Math.min(m,h.hp+n);return h.hp-b;}
function startCombat(e,boss,ctx){
 const h=S.hero,p=P();
 if(!(ctx&&ctx.free))h.sta-=boss?BOSS_COST:FIGHT_COST;
 S.cb={e,boss,ctx:ctx||{type:'hunt'},log:[],turn:1,focus:Math.floor(p.maxfocus/2),panel:null,hb:{atk:0,atkT:0,def:0,defT:0,poison:0,pd:0,stun:0,weak:0},over:false};
 say(`${e.tier==='b'?'👑':e.tier==='e'?'⭐':'⚔️'} ${esc(e.name)} (Lv ${e.lvl}) appears!`,'y');
 if(e.intro)say(`<i>${e.intro}</i>`);
 S.screen='combat';
}
function strike(mult,o){
 o=o||{};const p=P(),c=S.cb,e=c.e,h=S.hero;
 let b=(o.magic?(p.int*2.6+p.atk*.35):p.atk)*mult*rnd(.9,1.1)*(1+c.hb.atk)*(1+bestBonus(e.base))*(c.hb.weak>0?.75:1);
 const crit=!o.nocrit&&Math.random()*100<p.crit;if(crit)b*=p.critdmg/100;
 const d=Math.max(1,Math.round(b*(1-mit(e.def,h.lvl)*(1-(o.pierce||0)))));
 e.hp=Math.max(0,e.hp-d);
 let ls=0;if(p.lifesteal)ls=healHero(Math.round(d*p.lifesteal/100));
 say(`${o.label||'You hit'} ${esc(e.name)} for <b>${d}</b>${crit?' 💥 CRIT':''}${ls?` (+${ls} HP)`:''}`);
 return d;
}
function castSkill(id){
 const c=S.cb,h=S.hero,p=P(),e=c.e,l=h.skills[id],s=SK[id];
 if(c.focus<s.c){say('Not enough Focus!','e');return false;}
 c.focus-=s.c;
 switch(id){
  case 'power':strike(1.6+.15*(l-1),{label:'💪 Power Strike hits'});break;
  case 'flurry':for(let i=0;i<3&&e.hp>0;i++)strike(.6+.06*(l-1),{label:'🗡️ Flurry cuts'});break;
  case 'bash':strike(1+.1*(l-1),{label:'🛡️ Shield Bash hits'});if(Math.random()<(50+8*l)/100){e.stun=1;say(`${esc(e.name)} is stunned!`,'g');}break;
  case 'mend':{const n=healHero(Math.round(p.maxhp*(.22+.05*(l-1))+p.int*2));say(`💚 Mend restores ${n} HP.`,'g');break;}
  case 'venom':strike(.8+.08*(l-1),{label:'🐍 Venom Stab hits'});e.poison=3;e.pd=Math.max(1,Math.round(p.atk*.35*(1+.1*(l-1))));say(`${esc(e.name)} is poisoned!`,'g');break;
  case 'cry':c.hb.atk=.3+.05*(l-1);c.hb.atkT=3;say('📣 Battle Cry! Attack up for 3 turns.','g');break;
  case 'fire':strike(2+.2*(l-1),{magic:1,pierce:.5,label:'🔥 Fireball scorches'});break;
  case 'iron':c.hb.def=.5+.1*(l-1);c.hb.defT=3;say('🪨 Iron Skin! Defense up for 3 turns.','g');break;
  case 'bite':{const d=strike(1.3+.12*(l-1),{label:'🧛 Vampiric Bite tears'});const n=healHero(Math.round(d*.5));if(n)say(`You drain ${n} HP.`,'g');break;}
  case 'exec':strike(1.2+(1-e.hp/e.max)*(2+.4*(l-1)),{label:'☠️ Execute strikes'});break;
  case 'meteor':strike(4+.5*(l-1),{magic:1,label:'☄️ Meteor crashes into'});break;
 }
 return true;
}
function enemyTurn(){
 const c=S.cb,e=c.e,h=S.hero,p=P();
 if(e.poison>0){e.hp=Math.max(0,e.hp-e.pd);e.poison--;say(`☠ ${esc(e.name)} takes ${e.pd} poison damage.`);if(e.hp<=0)return;}
 if(e.stun>0){e.stun--;say(`💫 ${esc(e.name)} is stunned and loses its turn!`,'g');return;}
 if(e.pat2&&!e.ph&&e.hp<=e.max*.5){e.ph=1;e.pat=e.pat2;e.pi=0;say(`💢 ${esc(e.name)} ENRAGES! Its attacks change.`,'e');}
 const tk=e.pat[e.pi%e.pat.length];e.pi++;
 if(tk==='r'){const n=Math.round(e.max*.12);e.hp=Math.min(e.max,e.hp+n);say(`💚 ${esc(e.name)} recovers ${n} HP.`);return;}
 if(tk==='b'){e.buff=3;say(`🔥 ${esc(e.name)} rages! Its attacks grow stronger.`,'e');return;}
 const mult=PAT_MULT[tk]*(e.buff>0?1.3:1);
 if(e.buff>0)e.buff--;
 if(Math.random()*100<p.dodge){say(`💨 You dodge ${esc(e.name)}'s attack!`,'g');return;}
 const def=p.def*(1+c.hb.def);
 let d=e.atk*mult*rnd(.9,1.1)*(1-mit(def,e.lvl));
 if(c.guard)d*=.45;
 d=Math.max(1,Math.round(d));
 h.hp-=d;
 say(`${esc(e.name)} ${tk==='h'?'smashes':'hits'} you for <b>${d}</b>${c.guard?' (guarded)':''}.`,'e');
 if(p.thorns){const t=Math.round(d*p.thorns/100);if(t>0){e.hp=Math.max(0,e.hp-t);say(`🌵 Thorns deal ${t} back.`,'g');}}
 if(tk==='d'){const n=Math.round(d*.6);e.hp=Math.min(e.max,e.hp+n);say(`🩸 ${esc(e.name)} drains ${n} HP from you.`,'e');}
 if(tk==='c'){c.hb.weak=3;say('🌑 A curse saps your strength!','e');}
 if(tk==='p'){c.hb.poison=3;c.hb.pd=Math.max(1,Math.round(e.atk*.12));say('☠ You are poisoned!','e');}
 if(tk==='s'&&Math.random()<.4){c.hb.stun=1;say('💫 You are stunned!','e');}
}
function checkDeath(){
 const h=S.hero;if(h.hp>0)return true;
 for(const s of SLOTS){const it=h.equip[s];if(it&&it.sp==='phoenix'){delete h.equip[s];h.hp=Math.round(P().maxhp*.5);say('🔥 The Ring of Second Chances burns away — you rise again!','y');note('The Ring of Second Chances saved your life, and crumbled.','y');return true;}}
 die(`slain by ${S.cb?S.cb.e.name:'the wilds'}`);return false;
}
function afterPlayer(){
 const c=S.cb,h=S.hero,p=P();
 if(c.e.hp<=0)return victory();
 enemyTurn();
 if(c.e.hp<=0)return victory();
 if(!checkDeath())return;

function playerAct(type,arg){

 else if(type==='guard'){c.guard=true;c.focus=Math.min(p.maxfocus,c.focus+3);say('🛡️ You brace yourself.');}

 }
 else if(type==='flee'){

  case 'kill':case 'room':case 'puzzle':return[Math.min(qs.p,st.n),st.n];

const DIRS={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]},OPP={n:'s',e:'w',s:'n',w:'e'},DNAME={n:'North',e:'East',s:'South',w:'West'},DARR={n:'⬆️',e:'➡️',s:'⬇️',w:'⬅️'};
const ROOM_IC={start:'🚪',fight:'⚔️',elite:'💀',treasure:'📦',trap:'⚠️',puzzle:'🧩',shrine:'🕯️',rest:'⛲',lore:'📜',npc:'💬',empty:'·',key:'🗝️',boss:'👑',vault:'💎'};
function genDungeon(D){

 for(let i=0;i<N;i++)rooms.push({i,x:i%W,y:Math.floor(i/W),t:'empty',d:0,s:0,ex:{n:0,e:0,s:0,w:0},dist:0});

 const start=(H-1)*W+Math.floor(W/2);

  const r=rooms[stack[stack.length-1]];
  const opts=Object.keys(DIRS).filter(d=>{const n=nb(r,d);return n&&!seen.has(n.i);});
  if(!opts.length){stack.pop();continue;}
  const d=pick(opts),n=nb(r,d);r.ex[d]=1;n.ex[OPP[d]]=1;seen.add(n.i);stack.push(n.i);
 }
 rooms.forEach(r=>['e','s'].forEach(d=>{const n=nb(r,d);if(n&&!r.ex[d]&&Math.random()<.14){r.ex[d]=1;n.ex[OPP[d]]=1;}}));
 // BFS distances
 const q=[start],dist={[start]:0};
 while(q.length){const i=q.shift();Object.keys(DIRS).forEach(d=>{if(rooms[i].ex[d]){const n=nb(rooms[i],d);if(dist[n.i]==null){dist[n.i]=dist[i]+1;q.push(n.i);}}});}
 rooms.forEach(r=>r.dist=dist[r.i]||0);
 const maxd=Math.max(...rooms.map(r=>r.dist));

 rooms[start].t='start';rooms[start].d=1;rooms[start].s=1;rooms[boss].t='boss';
 if(D.key)Object.keys(DIRS).forEach(d=>{const r=rooms[boss];if(r.ex[d]){const n=nb(r,d);r.ex[d]=2;n.ex[OPP[d]]=2;}});

 if(D.key){
  const c=rooms.filter(r=>r.t==='empty'&&r.dist>=Math.max(2,maxd*.4)&&r.dist<=maxd*.8);
  const k=pick(c.length?c:free());k.t='key';
 }
 if(D.secret&&N>=9){
  const dead=rooms.filter(r=>r.t==='empty'&&Object.values(r.ex).filter(v=>v>0).length===1&&r.dist>=3);
  if(dead.length){const v=pick(dead);v.t='vault';v.secret=1;Object.keys(DIRS).forEach(d=>{if(v.ex[d]){const n=nb(v,d);v.ex[d]=3;n.ex[OPP[d]]=3;}});}
 }
 const pool=rooms.filter(r=>r.t==='empty').sort(()=>Math.random()-.5);
 const mand=['treasure','puzzle'];if(N>=9)mand.push('rest','trap');if(N>=12)mand.push('npc','fight');if(N>=16)mand.push('shrine','puzzle','lore');if(N>=20)mand.push('elite','treasure');
 mand.forEach(t=>{const r=pool.pop();if(r)r.t=t;});
 const wts=[['fight',30],['treasure',12],['trap',12],['puzzle',12],['shrine',5],['rest',5],['lore',6],['npc',6],['empty',8]];if(N>=12)wts.push(['elite',5]);

  if(r.t==='empty'&&r.dist>0)r.d=1;
  if(r.t==='treasure'||r.t==='vault'){r.tr=Math.random()<.35;r.mm=r.t==='treasure'&&Math.random()<.07;}
  if(r.t==='puzzle')r.pz=pick(['riddle','levers','lock','memory','doors','scales']);
  if(r.t==='trap')r.tp=ri(0,TRAPS.length-1);

 });

}

const LV=[['🔴','Red'],['🔵','Blue'],['🟢','Green'],['🟡','Yellow']];
function perms(n){if(n===1)return[[0]];const out=[];perms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);out.push(q);}});return out;}
PZ.levers={n:'Lever Sequence',soft:false,tries:3,
 gen(D){
  const n=D.lvl<20?3:4,all=perms(n),sol=pick(all),pos=a=>sol.indexOf(a);
  const mk=()=>{const a=ri(0,n-1);let b=ri(0,n-1);while(b===a)b=ri(0,n-1);const ty=pick(['before','before','notfirst','notlast','adj']);
   if(ty==='before'&&pos(a)>pos(b))return mk();if(ty==='notfirst'&&pos(a)===0)return mk();if(ty==='notlast'&&pos(a)===n-1)return mk();if(ty==='adj'&&pos(b)!==pos(a)+1)return mk();return{ty,a,b};};
  const test=(c,p)=>{const x=p.indexOf(c.a),y=p.indexOf(c.b);return c.ty==='at'?x===c.b:c.ty==='before'?x<y:c.ty==='notfirst'?x!==0:c.ty==='notlast'?x!==n-1:y===x+1;};
  const clues=[];let cand=all.slice();
  for(let i=0;i<40&&cand.length>1;i++){const c=mk();const nc=cand.filter(p=>test(c,p));if(nc.length<cand.length){clues.push(c);cand=nc;}}
  for(let a=0;cand.length>1&&a<n;a++){const c={ty:'at',a,b:pos(a)};const nc=cand.filter(p=>test(c,p));if(nc.length<cand.length){clues.push(c);cand=nc;}}
  const nm=i=>`${LV[i][0]} ${LV[i][1]}`;
  clues.forEach(c=>{c.txt=c.ty==='at'?`The ${nm(c.a)} lever is pulled ${['first','second','third','fourth'][c.b]}.`:c.ty==='before'?`The ${nm(c.a)} lever is pulled before the ${nm(c.b)} lever.`:c.ty==='notfirst'?`The ${nm(c.a)} lever is never pulled first.`:c.ty==='notlast'?`The ${nm(c.a)} lever is never pulled last.`:`The ${nm(c.b)} lever is pulled immediately after the ${nm(c.a)} lever.`;});
  return{n,sol,clues,sel:[]};},
 act(pz,p){const d=pz.d;if(p==='r'){d.sel=[];return;}const i=+p;if(d.sel.includes(i))return;d.sel.push(i);
  if(d.sel.length===d.n){if(d.sel.every((v,k)=>v===d.sol[k]))return 'win';d.sel=[];return 'bad';}},
 hint(pz){const d=pz.d;let k=0;while(k<d.sel.length&&d.sel[k]===d.sol[k])k++;d.sel=d.sol.slice(0,Math.min(d.n-1,k+1));return 'A lever clicks into place on its own.';},
 view(pz){const d=pz.d,nm=i=>`${LV[i][0]} ${LV[i][1]}`;
  return `<p class="mut sm">The inscriptions say:</p><div class="card sm">${d.clues.map(c=>`• ${c.txt}`).join('<br>')}</div><p>Order pulled: ${d.sel.length?d.sel.map(nm).join(' → '):'<span class="mut">none</span>'}</p><div class="grid">${[...Array(d.n).keys()].map(i=>btn(nm(i),'pz',i,'',d.sel.includes(i))).join('')}</div><div style="height:6px"></div>${btn('Reset','pz','r','c')}`;}
};
PZ.lock={n:'Combination Lock',soft:true,tries:7,
 gen(D){return{code:shuffle([1,2,3,4,5,6]).slice(0,3),cur:[],hist:[],rev:null};},
 act(pz,p){const d=pz.d;
  if(p==='del'){d.cur.pop();return;}
  if(p==='go'){if(d.cur.length<3)return;let ex=0,mis=0;d.cur.forEach((v,i)=>{if(v===d.code[i])ex++;else if(d.code.includes(v))mis++;});d.hist.push({g:d.cur.slice(),ex,mis});const w=ex===3;d.cur=[];return w?'win':'bad';}

  return `<p class="mut sm">A 3-digit code, digits 1–6, no repeats. 🟢 = right digit in the right place, 🟡 = right digit, wrong place.</p>`+(d.rev!=null?`<p class="sm up">Hint: digit ${d.rev+1} is ${d.code[d.rev]}.</p>`:'')+
  `<div class="card sm">${d.hist.length?d.hist.map(h=>`${h.g.join(' ')} → 🟢${h.ex} 🟡${h.mis}`).join('<br>'):'<span class="mut">No guesses yet.</span>'}</div><p class="c" style="font-size:28px;letter-spacing:8px">${[0,1,2].map(i=>d.cur[i]||'·').join(' ')}</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6].map(v=>btn(v,'pz',v,'c',d.cur.includes(v))).join('')}</div><div class="grid" style="margin-top:8px">${btn('⌫ Delete','pz','del','c')}${btn('Try code','pz','go','pri c',d.cur.length<3)}</div>`;}
};

 gen(D){const len=4+Math.floor(D.lvl/25);return{seq:[...Array(len)].map(()=>ri(0,4)),pos:0,show:true,len};},
 act(pz,p){const d=pz.d;if(d.show)return;const v=+p;if(v===d.seq[d.pos]){d.pos++;if(d.pos>=d.seq.length)return 'win';return;}d.pos=0;d.show=true;schedHide(pz);return 'bad';},

 act(pz,p){const i=+p;if(pz.d.elim.includes(i))return;if(i===pz.d.ans)return 'win';pz.d.elim.push(i);return 'bad';},

  const dg=S.dg,r=dgRoom(),D=getD(dg.id);if(r.d||r.opened)return;

  if(mode==='pick'){if(Math.random()*100<chkChance('agi',1,L)){trap=false;lines.push('🔓 You deftly pick the lock.');}else lines.push('🔧 The lock fights back.');}
  if(mode==='smash'){if(Math.random()*100<chkChance('str',0,L)){trap=false;smash=true;lines.push('💥 You smash the chest open. Something inside breaks.');}else{trap=r.tr;lines.push('💥 The chest holds. You hurt your hands.');const d=trapHit(.25);lines.push(`💔 −${d} HP`);}}
  if(r.mm){r.t='elite';r.e=buildDgEnemy(D,'elite',{mimic:true});dgSay([...lines,'🦷 <b>It is a mimic!</b>']);return;}
  if(trap){const d=trapHit(1);lines.push(`⚠️ A trap springs! −${d} HP`);}
  lines.push(...chestLoot(D,vault,smash));
  if(hasSpecial('delver'))lines.push('🏮 The lantern reveals extra loot.');

 },
 dgTrap(mode){
  const dg=S.dg,r=dgRoom(),D=getD(dg.id),L=D.lvl;if(r.d)return;
  let ok,lines=[];
  if(mode==='dodge')ok=Math.random()*100<chkChance('agi',0,L);
  else if(mode==='disarm')ok=Math.random()*100<chkChance('int',1,L);
  else{ok=true;const d=trapHit(.5);lines.push(`🛡️ You power through. −${d} HP`);}
  if(mode!=='brace'){if(ok)lines.push('✅ You get past safely.');else{const d=trapHit(1);lines.push(`💥 You trigger it! −${d} HP`);}}
  const x=Math.round((10+L*3.2)*.5*catchMult());lines.push(`✨ +${x} XP`);lines.push(...addXP(x));

 },
 dgShrine(mode){
  const dg=S.dg,r=dgRoom(),D=getD(dg.id),h=S.hero,w=S.world;if(r.d)return;
  const L=D.lvl,u=10+L*3,lines=[];

  else if(mode==='gold'){if(w.gold<u){dgSay('Not enough gold.');return;}w.gold-=u;lines.push(`💸 −${u} gold`,addFx('bless'),addFx('lucky'));}
  else if(mode==='blood'){const d=Math.max(1,Math.round(P().maxhp*.2));h.hp=Math.max(1,h.hp-d);lines.push(`🩸 −${d} HP`,addFx('fury'));}

 dgRest(){const r=dgRoom();if(r.d)return;const h=S.hero;const n=healHero(Math.round(P().maxhp*.45));h.fx=h.fx.filter(f=>f.id!=='curse');r.d=1;dgSay([`⛲ You rest by the water. +${n} HP, and any curse washes away.`]);},
 dgLore(){

 dgNpc(){

 dgPz(){const dg=S.dg,r=dgRoom(),D=getD(dg.id);if(r.d)return;startPuzzle(r.pz,D,r.i);},
 dgSearch(){
  const dg=S.dg,r=dgRoom();if(r.sr)return;r.sr=1;
  const p=P(),chance=clamp(30+(p.st.int+p.st.agi)*.8,25,85);
  let found=false;
  Object.keys(DIRS).forEach(d=>{if(r.ex[d]===3&&Math.random()*100<chance+15){const n=dgNb(r,d);r.ex[d]=1;n.ex[OPP[d]]=1;found=true;dgSay(`🔍 <b>You discover a hidden passage to the ${DNAME[d]}!</b>`);}});
  if(!found){if(Math.random()<.2){const g=Math.round((10+getD(dg.id).lvl*3)*.5);S.world.gold+=g;dgSay(`🔍 You find ${g} gold in a crack.`);}else dgSay('🔍 You search thoroughly, but find nothing.');}

 dgCamp(){
  const dg=S.dg,r=dgRoom(),D=getD(dg.id);if(dg.camps>=2){dgSay('You cannot risk another camp here.');return;}

  else dgSay(`⛺ You make camp and rest safely. +${n} HP (${2-dg.camps} camp${2-dg.camps===1?'':'s'} left)`);

 pz(p){
  const pz=S.pz,spec=PZ[pz.kind];const res=spec.act(pz,p);

 jtab(t){S.jtab=t;},
 rumor(){
  const h=S.hero,w=S.world,cost=Math.round(15+h.lvl*4);
  if(w.gold<cost){note('Not enough gold for rumors.','e');return;}
  w.gold-=cost;const r=rankIdx(h.contracts);
  const hid=DUNGEONS.filter(d=>!d.dyn&&!d.hidden&&!w.map.found[d.id]&&d.zi<=Math.min(5,r+1));
  if(hid.length){const d=pick(hid);w.map.found[d.id]=1;S.rumor=`A drunk whispers about <b>${d.n}</b>. "${esc(d.desc)}" You mark it on your map. (−${cost}g)`;}
  else S.rumor=pick(['The regulars swear the Hollow Library is real, but no one has found it.','Someone says the guild hall has a secret vault. Most say it\'s a story.','"Your family has done this before," the barkeep says, without looking up.','An old soldier tells of a ring that burns once, and only for the worthy.'])+` (−${cost}g)`;
 },

});

/* ---------------- rendering ---------------- */
const bar=(cur,max,cls)=>`<div class="bar ${cls}"><i style="width:${clamp(cur/max*100,0,100)}%"></i></div>`;
const btn=(label,act,p,cls,dis,sub)=>`<button class="btn ${cls||''}" data-a="${act}" ${p!==undefined?`data-p="${p}"`:''} ${dis?'disabled':''}>${label}${sub?`<small>${sub}</small>`:''}</button>`;
function logHtml(arr,n){return `<div class="log" id="log">${arr.slice(-n).map(l=>`<div class="${l.c}">${l.t}</div>`).join('')}</div>`;}
function itemRow(it,extra){
 const a=Object.keys(it.st).slice(0,4).map(k=>statLine(k,it.st[k])).join(' · ');
 return `<div class="item" data-a="open" data-p="${it.id}"><div><div class="n">${SLOT_ICON[it.slot]} ${rarName(it)}</div><div class="s">Lv ${it.il} · ${a}</div></div><div class="s">${extra||''}</div></div>`;
}

  t+=`<h3>${r.t==='vault'?'💎 Secret Vault':'📦 Chest'}</h3><p class="mut sm">${hasSpecial('delver')?(r.tr?'🏮 Your lantern shows: trapped.':'🏮 Your lantern shows: safe.'):'It might be trapped. It might bite.'}</p>
  ${btn('Open it','dgChest','open','pri')}<div style="height:6px"></div><div class="grid">${btn('Pick the lock','dgChest','pick','c',false,`AGI ${chkChance('agi',1,D.lvl)}%`)}${btn('Smash it','dgChest','smash','c',false,`STR ${chkChance('str',0,D.lvl)}% · worse loot`)}</div>`;
 }else if(r.t==='trap'&&!r.d){
  const tp=TRAPS[r.tp];
  t+=`<h3>⚠️ ${tp[0]}</h3><p>${tp[1]}</p><div class="grid">${btn('Dodge','dgTrap','dodge','c',false,`AGI ${chkChance('agi',0,D.lvl)}%`)}${btn('Disarm','dgTrap','disarm','c',false,`INT ${chkChance('int',1,D.lvl)}%`)}</div><div style="height:6px"></div>${btn('Brace and push through','dgTrap','brace','',false,'certain, but you take half damage')}${retreat?'<div style="height:6px"></div>'+retreat:''}`;
 }else if(r.t==='puzzle'&&!r.d){
  t+=`<h3>🧩 ${PZ[r.pz].n}</h3><p class="mut sm">Solving it opens a hidden cache. Failure hurts.</p>${btn('Attempt it','dgPz',undefined,'pri c')}`;
 }else if(r.t==='shrine'&&!r.d){
  t+=`<h3>🕯️ ${SHRINES[r.sh]}</h3><div class="grid">${btn('Pray','dgShrine','pray','c',false,'gamble')}${btn('Offer gold','dgShrine','gold','c',false,`${10+D.lvl*3}g`)}</div><div style="height:6px"></div>${btn('Offer blood','dgShrine','blood','',false,'−20% HP for Fury')}`;
 }else if(r.t==='rest'&&!r.d){
  t+=`<h3>⛲ A quiet place</h3>${btn('Rest here','dgRest',undefined,'good c',false,'heal 45% & cleanse curses')}`;
 }else if(r.t==='lore'&&!r.d){
  t+=`<h3>📜 Inscriptions</h3>${btn('Read them','dgLore',undefined,'c')}`;
 }else if(r.t==='npc'&&!r.d){
  t+=`<h3>💬 A stranger</h3>${btn('Approach','dgNpc',undefined,'c')}`;
 }else if(r.d&&r.t!=='start'&&r.t!=='empty')t+=`<p class="mut sm">✔ Cleared.</p>`;
 t+='</div>';
 // movement
 const bn=dg.rooms[dg.boss];
 t+='<div class="dgpad">';
 const cell=d=>{
  const code=r.ex[d];
  if(!code||code===3)return `<div></div>`;
  const n=dgNb(r,d),ic=code===2?'🔒':n.s?ROOM_IC[n.t]:'❔';
  return btn(`${DARR[d]} ${DNAME[d]} ${ic}`,'dgGo',d,'c');
 };
 t+=`<div></div>${cell('n')}<div></div>${cell('w')}<div class="dgme">🧍</div>${cell('e')}<div></div>${cell('s')}<div></div></div>`;
 // utilities
 t+='<div class="grid" style="margin-top:10px">';
 t+=btn('🔍 Search','dgSearch',undefined,'c',!!r.sr,r.sr?'searched':'for secrets');
 t+=btn('⛺ Camp','dgCamp',undefined,'c',dg.camps>=2,'25% HP, risky');
 t+='</div>';
 const pk=Object.keys(POTS).filter(k=>w.pots[k]>0);
 if(pk.length&&h.hp<p.maxhp)t+='<div style="margin-top:8px">'+pk.map(k=>btn(`🧪 ${POTS[k].n} ×${w.pots[k]}`,'dgPot',k,'good c')).join('')+'</div>';
 if(bn.d)t+=`<div style="margin-top:8px">${btn('🌀 Take the exit portal','dgFinish',undefined,'pri c')}</div>`;
 else if(r.t==='start')t+=`<div style="margin-top:8px">${btn('🚪 Leave (progress is saved)','dgLeave',undefined,'c')}</div>`;
 t+=`<div style="margin-top:8px">${btn('Flee the dungeon (lose progress)','dgEscape',undefined,'bad c')}</div>`;
 return t;
};
const pick2=(a,i)=>a[i%a.length];
VIEWS.puzzle=function(){
 const pz=S.pz,spec=PZ[pz.kind],D=getD(pz.dg),c=pzHintCost();
 return `<h1>🧩 ${spec.n}</h1><div class="row2 sm mut"><span>Tries left: <b>${pz.tries}</b>/${pz.max}</span><span>${spec.soft?'Mistakes only hurt at the end':'Mistakes hurt'}</span></div>
 <div class="card">${spec.view(pz)}</div>${pz.msg?`<p class="${pz.msg.startsWith('💡')?'up':'dn'} sm">${esc(pz.msg)}</p>`:''}
 <div class="grid">${btn('💡 Hint','pzHint',undefined,'c',S.world.gold<c,c?c+'g':'free')}${btn('Step away','pzQuit',undefined,'c')}</div>`;
};
VIEWS.talk=function(){
 const t=S.talk,q=QS[t.id],h=S.hero;
 let s=`<h1>💬 ${esc(q.npc)}</h1>`;
 if(t.mode==='offer'){
  s+=`<div class="card"><p><i>${q.offer.t}</i></p></div><div class="mut sm">Quest: <b>${esc(q.t)}</b> · ${q.steps.length} step${q.steps.length>1?'s':''}</div><div class="grid" style="margin-top:8px">${btn('Accept','tacc',undefined,'pri c')}${btn('Not now','tback',undefined,'c')}</div>`;
 }else if(t.mode==='accepted'){
  s+=`<div class="card"><p>📜 <b>Quest accepted: ${esc(q.t)}</b></p><p>${esc(q.steps[0].j)}</p></div>${btn('Back','tback',undefined,'c')}`;
 }else if(t.mode==='res'){
  s+=`<div class="card">${t.lines.map(l=>`<p>${l}</p>`).join('')}</div>${btn('Done','tback',undefined,'pri c')}`;
 }else{
  const st=qStep(t.id),pr=stepProg(t.id),done=pr[0]>=pr[1];
  s+=`<div class="card"><p><i>${st.tk.t}</i></p></div>`;
  if(!done)s+=`<p class="mut sm">Objective: ${esc(st.j)} (${pr[0]}/${pr[1]})</p>${btn('Back','tback',undefined,'c')}`;
  else s+=st.tk.ch.map((c,i)=>btn(esc(c.l),'tch',i,'')).join('');
 }
 return s;
};
VIEWS.journal=function(){
 const h=S.hero,w=S.world,tab=S.jtab;
 const tabs=[['quests','📜 Quests'],['places','🗺️ Places'],['best','📕 Bestiary'],['perks','🏘️ Perks & Lore']];
 let t=`<h1>📖 Journal</h1><div class="grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:8px">${tabs.map(x=>btn(x[1],'jtab',x[0],tab===x[0]?'pri c':'c')).join('')}</div>`;
 if(tab==='quests'){
  const act=Object.keys(h.q);
  t+=`<p class="mut sm">Active: ${act.length} · Completed: ${Object.keys(h.qd).length}/${QLIST.length}</p>`;
  t+=act.length?act.map(id=>questCard(QS[id])).join(''):'<p class="mut">No active quests. Visit the Town Square, or explore the wilds to meet wanderers.</p>';
 }else if(tab==='places'){
  ZONES.forEach((z,i)=>{
   const ex=Math.floor(w.map.explore[i]);
   const ids=LANDMARKS[i].map(l=>l.id).concat(DUNGEONS.filter(d=>d.hidden&&d.zi===i).map(d=>d.id));
   t+=`<div class="card"><div class="row2"><b>${z.ic} ${z.n}</b><span class="tag">${ex}%</span></div>${bar(ex,100,'sta')}${ids.map(id=>{const D=DG[id],f=w.map.found[id];return `<div class="sm" style="margin-top:4px">${f?`${D.ic} <b>${D.n}</b> · Lv ${D.lvl}+ · ${(w.map.cleared[id]||0)?'cleared ×'+w.map.cleared[id]:'unexplored'}`:'<span class="mut">❔ Undiscovered location</span>'}</div>`;}).join('')}</div>`;
  });
  if(w.anc.length)t+=`<div class="card sm">⚰️ <b>Crypt of Heirs</b> · ${w.anc.filter(a=>w.map.flags['echo'+a.gen]).length}/${w.anc.length} echoes at rest</div>`;
 }else if(tab==='best'){
  const e=Object.keys(w.best).sort((a,b)=>w.best[b].k-w.best[a].k);
  t+=`<p class="mut sm">Every 10 kills of a species grants +1% damage against it (max +25%). Bestiary entries are shared across your whole bloodline.</p>`;
  t+=e.length?e.map(n=>`<div class="item" style="cursor:default"><div><div class="n">${esc(n)}</div><div class="s">${ZONES[w.best[n].zi].n}</div></div><div class="s">×${w.best[n].k} · +${Math.round(bestBonus(n)*100)}%</div></div>`).join(''):'<p class="mut">No creatures catalogued yet.</p>';
 }else{
  const pk=Object.keys(PERKS).filter(k=>wf(k));
  t+='<h2>Town perks</h2>'+(pk.length?pk.map(k=>`<div class="card sm"><b>${PERKS[k][0]}</b><br><span class="mut">${PERKS[k][1]}</span></div>`).join(''):'<p class="mut sm">Do favors for the townsfolk to earn lasting perks. They carry over to your heirs.</p>');
  const lk=Object.keys(w.map.lore);
  t+='<h2>Lore found</h2>'+(lk.length?lk.map(k=>{const [id,i]=k.split(':'),D=DG[id];return `<div class="card sm"><b>${D.ic} ${D.n}</b><br><i>${esc(D.lore[+i%D.lore.length])}</i></div>`;}).join(''):'<p class="mut sm">Read inscriptions in dungeons to collect lore.</p>');
 }
 return t;
};
const _result=VIEWS.result;
VIEWS.result=function(){
 const r=S.res,ctx=r.ctx||{},h=S.hero;
 if(!ctx.type||ctx.type==='hunt')return _result();
 let b;
 if(ctx.type==='dg')b=r.done?btn('🌀 Leave the dungeon','dgFinish',undefined,'pri c'):btn('Continue','go','dungeon','pri c');
 else b=`<div class="grid">${btn('Keep exploring','explore',ctx.zi,'pri c',h.sta<1,'1⚡')}${btn('Back','go','hunt','c')}</div>`;
 return `<h1>🏆 Victory</h1><p class="mut">${esc(r.name)} (Lv ${r.lvl}) defeated.</p><div class="card">${r.lines.map(l=>`<p>${l}</p>`).join('')}</div><p class="sm mut">❤ ${h.hp}/${P().maxhp} · ⚡ ${h.sta}/${P().maxsta}</p>${b}`;
};
const _hero=VIEWS.hero;
VIEWS.hero=function(){
 const h=S.hero;let t=_hero();
 t+=`<h2>Active effects</h2>`+(h.fx.length?h.fx.map(f=>`<div class="card sm">${FX[f.id].ic} <b>${FX[f.id].n}</b> · ${f.left} fights left</div>`).join(''):'<p class="mut sm">None.</p>');
 return t;
};
Object.assign(ACT,{
 dgPot(id){const p=P(),w=S.world,po=POTS[id];if(!w.pots[id]||S.hero.hp>=p.maxhp)return;w.pots[id]--;const n=healHero(Math.max(po.min,Math.round(p.maxhp*po.pct)));dgSay(`🧪 ${po.n}: +${n} HP.`);},
 dgEscape(){S.modal={t:'confirm',a:'dgEscapeYes',q:'Flee the dungeon? You lose all progress in it and 10% of your gold.'};},
 dgEscapeYes(){const w=S.world;S.modal=null;w.gold-=Math.round(w.gold*.1);delete S.hero.dgsave[S.dg.id];S.dg=null;S.screen='hunt';note('You fled the dungeon, shaken.','e');}
});
const NAV=[
 ['town','🏘️','Town',['town','train','hunt','enc','result','shop','library','tinker','square','tavern','crypt','explore','dungeon','puzzle','talk']],
 ['journal','📖','Journal',['journal']],['hero','🧍','Hero',['hero']],['pack','🎒','Pack',['pack']],['guild','📜','Guild',['guild']],['menu','⚙️','Menu',['menu']]
];
function render(){
 if(typeof document==='undefined')return;
 const view=$('#view'),nav=$('#nav'),top=$('#top');
 if(!S){view.innerHTML=VIEWS.start();nav.style.display='none';top.style.display='none';$('#modal').innerHTML='';return;}
 if(S.cb&&S.screen!=='combat')S.screen='combat';
 if(S.screen==='enc'&&!S.enc)S.screen='hunt';
 if(S.screen==='result'&&!S.res)S.screen='town';
 if(S.screen==='dungeon'&&!S.dg)S.screen='town';
 if(S.screen==='puzzle'&&!S.pz)S.screen=S.dg?'dungeon':'town';
 if(S.screen==='explore'&&!S.ev)S.screen='hunt';
 if(S.screen==='talk'&&!S.talk)S.screen='square';
 const sc=S.screen,h=S.hero,p=P();
 top.style.display=sc==='death'?'none':'block';
 top.innerHTML=`<div class="row"><span><b>${esc(h.name)}</b> Lv ${h.lvl}</span><span>💰 <b>${fmt(S.world.gold)}</b></span><span>⚡ <b>${h.sta}/${p.maxsta}</b></span><span>Day <b>${h.day}</b></span></div>${bar(h.hp,p.maxhp,'hp')}<div class="row"><span>❤ ${h.hp}/${p.maxhp}</span><span>XP ${h.xp}/${xpNeed(h.lvl)}</span></div>`;
 view.innerHTML=VIEWS[sc]();
 const showNav=!['combat','death','enc'].includes(sc);
 nav.style.display=showNav?'flex':'none';
 const qm=questMark();
 nav.innerHTML=NAV.map(n=>`<button class="${n[3].includes(sc)?'on':''}" data-a="go" data-p="${n[0]}"><span>${n[1]}</span>${n[2]}${n[0]==='hero'&&h.pts?`<i class="dot">${h.pts}</i>`:''}${n[0]==='journal'&&qm?`<i class="dot">${qm}</i>`:''}</button>`).join('');
 $('#modal').innerHTML=modalHtml();
 const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight;
 if(S.lastScreen!==sc){window.scrollTo(0,0);S.lastScreen=sc;}
}

function main(){
 S=load();
 if(S&&S.world&&S.hero){S.modal=null;ensureState();} else S=null;
 document.addEventListener('click',e=>{
  const mod=e.target.closest('.mod');
  if(mod&&!e.target.closest('#sheet')){S.modal=null;render();return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,p=b.dataset.p;
  if(a==='closeBg')return;
  try{
   if(a==='start'){ACT.start();}
   else if(!S){return;}
   else if(a==='resetYes'){ACT.resetYes();render();return;}
   else{const f=ACT[a];if(!f)return;f(p,b);}
  }catch(err){if(err!=='skip')console.error(err);render();return;}
  if(S)save();render();
 });
 render();
}
if(typeof document!=='undefined'&&typeof window!=='undefined'&&!window.__TQ_TEST){main();}
if(typeof window!=='undefined')window.TQ={ensureState,genDungeon,buildDgEnemy,getD,DG,DUNGEONS,PZ,QS,QLIST,EVD,QEV,DGE,startPuzzle,doExplore,qAvail,startQuest,stepDone,stepProg,qEvent,applyOut,completeDungeon,chestLoot,RIDDLES,LANDMARKS,fleeOK,perms,wf,get S(){return S;},set S(v){S=v;},ACT,P,genItem,genLegend,makeEnemy,danger,LEGENDS,ZONES,SK,newWorld,newHero,startCombat,playerAct,victory,sleepDay,render,rankIdx,xpNeed,catchMult,refreshBoard,refreshShop,contractDone,huntUnlocked,die,makeHeir,AF,BASES,TIER_ADJ,save,load};
